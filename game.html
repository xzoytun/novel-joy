<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bermain Ular Tangga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a3c2a, #2b5a3a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-wrapper {
            background: rgba(255, 248, 235, 0.95);
            backdrop-filter: blur(8px);
            padding: 30px 35px;
            border-radius: 64px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 2px #d4a373 inset;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            max-width: 1150px;
            width: 100%;
        }
        .board-area {
            flex: 1 1 600px;
            min-width: 300px;
        }
        .board-area canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: #f0e4d3;
            border-radius: 36px;
            box-shadow: 0 8px 0 #b08968, 0 12px 30px rgba(0,0,0,0.3);
            display: block;
            image-rendering: crisp-edges;
        }
        .side-panel {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 210px;
        }
        .panel-box {
            background: #e8dccc;
            padding: 18px 20px;
            border-radius: 32px;
            border: 2px solid #c4b09a;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
        }
        .panel-box h3 {
            font-size: 1.1rem;
            color: #3c2a1f;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .player-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #b89f88;
            font-weight: 500;
            color: #2d1f14;
            font-size: 0.95rem;
        }
        .player-list li:last-child { border-bottom: none; }
        .p-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            border: 2px solid #5a3e2b;
        }
        .badge-turn {
            background: #d4a373;
            color: white;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #turnIndicator {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d1f14;
            padding: 4px 0;
        }
        /* Dadu CSS Keren */
        .dice-container {
            background: #e8dccc;
            padding: 18px 20px 20px;
            border-radius: 32px;
            border: 2px solid #c4b09a;
            text-align: center;
        }
        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 14px;
            margin: 0 auto 12px;
            box-shadow: 0 6px 0 #a0846a, 0 8px 20px rgba(0,0,0,0.15);
            transition: 0.15s;
        }
        .dot {
            background: #1f1f1f;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            max-width: 18px;
            max-height: 18px;
            place-self: center;
            display: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .dot.visible { display: block; }
        .btn-roll {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 0 #1a3c2a;
            width: 100%;
            letter-spacing: 1px;
        }
        .btn-roll:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #1a3c2a;
            background: #1f563b;
        }
        .btn-roll:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a3c2a;
        }
        .btn-roll:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a3c2a;
            pointer-events: none;
        }
        .btn-home {
            background: #b08968;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #7a5f47;
            width: 100%;
            margin-top: 4px;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a5f47;
            background: #9d7a5e;
        }
        .btn-home:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7a5f47;
        }
        .winner-box {
            background: #f7d44a;
            padding: 12px 16px;
            border-radius: 40px;
            font-weight: 700;
            text-align: center;
            color: #2d1f14;
            font-size: 1.1rem;
            border: 2px solid #b68b2e;
            box-shadow: 0 4px 0 #8b691f;
            display: none;
        }
        @media (max-width: 720px) {
            .game-wrapper { flex-direction: column; align-items: center; padding: 20px; }
            .side-panel { flex: 1 1 auto; width: 100%; max-width: 500px; }
            .dice { width: 70px; height: 70px; padding: 12px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="board-area">
        <canvas id="boardCanvas" width="600" height="600"></canvas>
    </div>
    <div class="side-panel">
        <div class="panel-box">
            <h3>👥 Pemain</h3>
            <ul class="player-list" id="playerList"></ul>
        </div>
        <div class="panel-box">
            <h3>🎯 Giliran</h3>
            <div id="turnIndicator">-</div>
        </div>
        <div class="dice-container">
            <div class="dice" id="diceBox">
                <span class="dot" data-pos="0"></span>
                <span class="dot" data-pos="1"></span>
                <span class="dot" data-pos="2"></span>
                <span class="dot" data-pos="3"></span>
                <span class="dot" data-pos="4"></span>
                <span class="dot" data-pos="5"></span>
                <span class="dot" data-pos="6"></span>
                <span class="dot" data-pos="7"></span>
                <span class="dot" data-pos="8"></span>
            </div>
            <button class="btn-roll" id="rollBtn">🎲 Lempar Dadu</button>
        </div>
        <div class="winner-box" id="winnerBox"></div>
        <button class="btn-home" id="homeBtn">🏠 Kembali ke Menu</button>
    </div>
</div>

<script>
    // --- Ambil jumlah pemain dari URL ---
    const params = new URLSearchParams(window.location.search);
    const numPlayers = parseInt(params.get('players')) || 2;

    // --- Data ular & tangga (from -> to) ---
    const snakeLadders = [
        { from: 3, to: 22 }, { from: 5, to: 8 }, { from: 20, to: 40 },
        { from: 27, to: 55 }, { from: 50, to: 75 }, { from: 63, to: 95 },
        { from: 70, to: 90 }, { from: 80, to: 100 },
        { from: 98, to: 78 }, { from: 95, to: 75 }, { from: 88, to: 68 },
        { from: 75, to: 55 }, { from: 65, to: 45 }, { from: 55, to: 35 },
        { from: 45, to: 25 }, { from: 35, to: 15 }, { from: 25, to: 5 }
    ];

    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];
    const colorNames = ['Merah', 'Biru', 'Hijau', 'Kuning'];

    // --- State ---
    let positions = new Array(numPlayers).fill(1);
    let currentPlayer = 0;
    let gameOver = false;
    let diceValue = 0;
    let isRolling = false;

    // --- DOM refs ---
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    const playerListEl = document.getElementById('playerList');
    const turnIndicator = document.getElementById('turnIndicator');
    const diceBox = document.getElementById('diceBox');
    const rollBtn = document.getElementById('rollBtn');
    const winnerBox = document.getElementById('winnerBox');
    const homeBtn = document.getElementById('homeBtn');

    // --- Mapping dadu (posisi titik di grid 3x3) ---
    const diceMap = {
        1: [4],
        2: [2, 6],
        3: [2, 4, 6],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
    };

    function updateDice(val) {
        const dots = diceBox.querySelectorAll('.dot');
        dots.forEach(d => d.classList.remove('visible'));
        if (val >= 1 && val <= 6) {
            const positions = diceMap[val] || [];
            positions.forEach(idx => {
                dots[idx].classList.add('visible');
            });
        }
    }

    // --- Koordinat papan (nomor 1 di kiri Bawah) ---
    function getRowCol(num) {
        const origRow = Math.floor((num - 1) / 10);
        let col = (num - 1) % 10;
        if (origRow % 2 === 1) col = 9 - col;
        const row = 9 - origRow; // 0 = atas, 9 = bawah
        return { row, col };
    }

    // --- Gambar papan ---
    function drawBoard() {
        const size = 600;
        const cell = size / 10;
        ctx.clearRect(0, 0, size, size);

        // Latar
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#f7efe2');
        grad.addColorStop(1, '#e8dccc');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Grid & angka
        for (let i = 1; i <= 100; i++) {
            const { row, col } = getRowCol(i);
            const x = col * cell;
            const y = row * cell;
            // warna sel bergantian
            ctx.fillStyle = ( (row + col) % 2 === 0 ) ? '#faf0e6' : '#dccbb8';
            ctx.fillRect(x, y, cell, cell);
            ctx.strokeStyle = '#b08968';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, cell, cell);

            // Angka
            ctx.fillStyle = '#3c2a1f';
            ctx.font = 'bold 15px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(i, x + cell/2, y + cell/2);
        }

        // Gambar ular & tangga
        snakeLadders.forEach(sl => {
            const from = sl.from;
            const to = sl.to;
            const f = getRowCol(from);
            const t = getRowCol(to);
            const fx = f.col * cell + cell/2;
            const fy = f.row * cell + cell/2;
            const tx = t.col * cell + cell/2;
            const ty = t.row * cell + cell/2;

            const isLadder = from < to;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 8;

            if (isLadder) {
                // Tangga hijau dengan anak tangga
                ctx.strokeStyle = '#2d6a4f';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(fx, fy);
                ctx.lineTo(tx, ty);
                ctx.stroke();
                // anak tangga
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#409f6b';
                ctx.lineWidth = 3;
                for (let step = 0.2; step < 1; step += 0.2) {
                    const lx = fx + (tx - fx) * step;
                    const ly = fy + (ty - fy) * step;
                    const angle = Math.atan2(ty - fy, tx - fx);
                    const perpX = -Math.sin(angle) * 12;
                    const perpY = Math.cos(angle) * 12;
                    ctx.beginPath();
                    ctx.moveTo(lx - perpX, ly - perpY);
                    ctx.lineTo(lx + perpX, ly + perpY);
                    ctx.stroke();
                }
            } else {
                // Ular merah dengan kepala
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(fx, fy);
                ctx.lineTo(tx, ty);
                ctx.stroke();
                // kepala ular (lingkaran di ujung)
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#c0392b';
                ctx.beginPath();
                ctx.arc(tx, ty, 9, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐍', tx - 2, ty - 1);
            }
            ctx.restore();
        });

        // Gambar token pemain
        positions.forEach((pos, idx) => {
            if (pos < 1 || pos > 100) return;
            const { row, col } = getRowCol(pos);
            const cx = col * cell + cell/2;
            const cy = row * cell + cell/2;
            const radius = 14;
            const color = colors[idx % colors.length];

            // Glow
            const grad2 = ctx.createRadialGradient(cx-4, cy-4, 2, cx, cy, radius+6);
            grad2.addColorStop(0, 'rgba(255,255,255,0.6)');
            grad2.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(cx, cy, radius+4, 0, 2*Math.PI);
            ctx.fillStyle = grad2;
            ctx.fill();

            // Lingkaran utama 3D
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            const grad3 = ctx.createRadialGradient(cx-5, cy-5, 3, cx, cy, radius);
            grad3.addColorStop(0, '#ffffff');
            grad3.addColorStop(0.3, color);
            grad3.addColorStop(1, '#1a1a1a');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = grad3;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inisial
            ctx.fillStyle = 'white';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(idx + 1, cx, cy + 1);
            ctx.shadowBlur = 0;
        });
    }

    // --- Update UI ---
    function updateUI() {
        // Daftar pemain
        let html = '';
        for (let i = 0; i < numPlayers; i++) {
            const active = (i === currentPlayer && !gameOver);
            const color = colors[i % colors.length];
            html += `<li>
                <span><span class="p-color" style="background:${color};"></span>${colorNames[i % colorNames.length]}</span>
                <span>${positions[i]} ${active ? '<span class="badge-turn">Giliran</span>' : ''}</span>
            </li>`;
        }
        playerListEl.innerHTML = html;

        turnIndicator.textContent = gameOver ? '🏁 Selesai!' : `${colorNames[currentPlayer % colorNames.length]} (${positions[currentPlayer]})`;
        rollBtn.disabled = gameOver || isRolling;

        if (gameOver) {
            const winIdx = positions.findIndex(p => p >= 100);
            if (winIdx !== -1) {
                winnerBox.style.display = 'block';
                winnerBox.textContent = `🎉 ${colorNames[winIdx % colorNames.length]} MENANG! 🎉`;
            }
        } else {
            winnerBox.style.display = 'none';
        }
    }

    // --- Giliran berikutnya ---
    function nextTurn() {
        if (gameOver) return;
        let next = (currentPlayer + 1) % numPlayers;
        let attempts = 0;
        while (positions[next] >= 100 && attempts < numPlayers) {
            next = (next + 1) % numPlayers;
            attempts++;
        }
        if (attempts === numPlayers) {
            gameOver = true;
            updateUI();
            return;
        }
        currentPlayer = next;
        isRolling = false;
        updateUI();
        drawBoard();
    }

    // --- Lempar dadu ---
    function rollDice() {
        if (gameOver || isRolling) return;
        isRolling = true;
        rollBtn.disabled = true;

        const val = Math.floor(Math.random() * 6) + 1;
        diceValue = val;
        updateDice(val);

        let newPos = positions[currentPlayer] + val;
        if (newPos > 100) newPos = positions[currentPlayer];

        let finalPos = newPos;
        let sl = snakeLadders.find(s => s.from === finalPos);
        while (sl) {
            finalPos = sl.to;
            sl = snakeLadders.find(s => s.from === finalPos);
        }
        positions[currentPlayer] = finalPos;

        drawBoard();

        if (finalPos >= 100) {
            positions[currentPlayer] = 100;
            gameOver = true;
            updateUI();
            drawBoard();
            isRolling = false;
            rollBtn.disabled = true;
            return;
        }

        updateUI();
        setTimeout(() => {
            nextTurn();
        }, 480);
    }

    // --- Init ---
    function initGame() {
        positions = new Array(numPlayers).fill(1);
        currentPlayer = 0;
        gameOver = false;
        diceValue = 0;
        isRolling = false;
        updateDice(1);
        drawBoard();
        updateUI();
        rollBtn.disabled = false;
        winnerBox.style.display = 'none';
    }

    // --- Event ---
    rollBtn.addEventListener('click', rollDice);
    homeBtn.addEventListener('click', () => window.location.href = 'index.html');

    initGame();
</script>
</body>
</html>
