<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga - Game Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1a1c29;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .turn-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Main Game Wrapper */
        .game-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Board Styling */
        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #2a2d43;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #3b3f5c;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 2px 4px;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .cell:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
        .cell:nth-child(even) { background: rgba(255, 255, 255, 0.06); }

        /* Tokens / Pion */
        .tokens-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .token {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .p1 { background: #ff4757; }
        .p2 { background: #2ed573; }
        .p3 { background: #ffa502; }
        .p4 { background: #3742fa; }

        /* Control Panel */
        .control-panel {
            background: #2a2d43;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-color-box {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }

        .player-details h3 {
            font-size: 15px;
            font-weight: 700;
        }

        .player-details p {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .dice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dice-btn {
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .dice-btn:hover {
            transform: scale(1.05);
        }

        .dice-btn:active {
            transform: scale(0.95);
        }

        .dice-btn:disabled {
            background: #57606f;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .dice-display {
            font-size: 13px;
            color: #ffd700;
            font-weight: 600;
        }

        /* Modal Pemenang */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #2a2d43;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 2px solid rgba(255,255,255,0.1);
            transform: scale(0.8);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-content i {
            font-size: 50px;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
        }

        .modal-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Menu</button>
        <div class="turn-indicator" id="turnIndicator">Giliran: Pemain 1</div>
    </div>

    <div class="game-container">
        <!-- Papan Ular Tangga -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
            <!-- Layer Pion -->
            <div class="tokens-container" id="tokensContainer"></div>
        </div>

        <!-- Panel Kontrol & Dadu -->
        <div class="control-panel">
            <div class="player-info">
                <div class="player-color-box" id="playerColorBox" style="background: #ff4757;"></div>
                <div class="player-details">
                    <h3 id="playerName">Pemain 1</h3>
                    <p id="playerPos">Posisi: 1</p>
                </div>
            </div>
            <div class="dice-area">
                <button class="dice-btn" id="rollBtn" onclick="rollDice()"><i class="fa-solid fa-dice"></i> Lempar</button>
                <div class="dice-display" id="diceResult">Dadu: -</div>
            </div>
        </div>
    </div>

    <!-- Modal Menang -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <i class="fa-solid fa-trophy"></i>
            <h2 id="winnerTitle">Pemain 1 Menang!</h2>
            <p>Selamat telah mencapai kotak 100 terlebih dahulu!</p>
            <button class="modal-btn" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script>
        const totalPlayers = parseInt(localStorage.getItem('snake_ladder_players')) || 4;
        
        // Konfigurasi Tangga & Ular
        const snakesAndLadders = {
            // Tangga (Naik)
            4: 14,
            9: 31,
            20: 38,
            28: 84,
            40: 59,
            51: 67,
            63: 81,
            71: 91,
            
            // Ular (Turun)
            17: 7,
            54: 34,
            62: 19,
            64: 60,
            87: 24,
            93: 73,
            95: 75,
            99: 78
        };

        const playerColors = ['#ff4757', '#2ed573', '#ffa502', '#3742fa'];
        const playerNames = ['Pemain 1', 'Pemain 2', 'Pemain 3', 'Pemain 4'];

        let players = [];
        for(let i = 0; i < totalPlayers; i++) {
            players.push({ id: i, pos: 1 });
        }

        let currentTurn = 0;
        let isRolling = false;

        // Generate Papan 10x10 gaya zig-zag
        function createBoard() {
            const board = document.getElementById('board');
            let cells = [];

            for (let row = 9; row >= 0; row--) {
                let rowCells = [];
                for (let col = 0; col < 10; col++) {
                    let cellNum;
                    if (row % 2 === 1) {
                        cellNum = row * 10 + (10 - col);
                    } else {
                        cellNum = row * 10 + (col + 1);
                    }
                    rowCells.push(cellNum);
                }
                cells.push(...rowCells);
            }

            cells.forEach(num => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.id = `cell-${num}`;
                cellDiv.innerHTML = `<span>${num}</span>`;
                
                // Tambahkan tanda visual kecil jika ada ular/tangga
                if(snakesAndLadders[num]) {
                    if(snakesAndLadders[num] > num) {
                        cellDiv.style.color = '#2ed573'; // Tangga
                    } else {
                        cellDiv.style.color = '#ff4757'; // Ular
                    }
                }

                board.appendChild(cellDiv);
            });

            updateTokens();
        }

        // Posisi kordinat grid untuk pion
        function getGridCoordinates(pos) {
            let p = pos - 1;
            let row = Math.floor(p / 10);
            let col = p % 10;
            if (row % 2 === 1) {
                col = 9 - col;
            }
            let actualRow = 9 - row;
            return { row: actualRow + 1, col: col + 1 };
        }

        function updateTokens() {
            const container = document.getElementById('tokensContainer');
            container.innerHTML = '';

            players.forEach((player, index) => {
                const coords = getGridCoordinates(player.pos);
                const token = document.createElement('div');
                token.className = `token p${player.id + 1}`;
                
                // Sedikit offset agar kalau di kotak yang sama tidak bertumpuk pas
                let offsetX = (index % 2) * 8;
                let offsetY = Math.floor(index / 2) * 8;

                token.style.gridRow = coords.row;
                token.style.gridColumn = coords.col;
                token.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

                container.appendChild(token);
            });
        }

        function updateUI() {
            const cp = players[currentTurn];
            document.getElementById('turnIndicator').innerText = `Giliran: ${playerNames[cp.id]}`;
            document.getElementById('playerName').innerText = playerNames[cp.id];
            document.getElementById('playerColorBox').style.background = playerColors[cp.id];
            document.getElementById('playerPos').innerText = `Posisi: ${cp.pos}`;
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('rollBtn').disabled = true;

            let rollAnimation = setInterval(() => {
                let tempRoll = Math.floor(Math.random() * 6) + 1;
                document.getElementById('diceResult').innerText = `Dadu: ${tempRoll}`;
            }, 80);

            setTimeout(() => {
                clearInterval(rollAnimation);
                let diceVal = Math.floor(Math.random() * 6) + 1;
                document.getElementById('diceResult').innerText = `Dadu: ${diceVal}`;
                
                movePlayer(diceVal);
            }, 600);
        }

        function movePlayer(steps) {
            let cp = players[currentTurn];
            let targetPos = cp.pos + steps;

            if (targetPos > 100) {
                // Jika melewati 100, tidak bergerak
                nextTurn();
                return;
            }

            cp.pos = targetPos;
            updateTokens();
            updateUI();

            setTimeout(() => {
                // Cek Ular atau Tangga
                if (snakesAndLadders[cp.pos]) {
                    let oldPos = cp.pos;
                    cp.pos = snakesAndLadders[cp.pos];
                    
                    setTimeout(() => {
                        updateTokens();
                        updateUI();
                        checkWin(cp);
                    }, 300);
                } else {
                    checkWin(cp);
                }
            }, 400);
        }

        function checkWin(cp) {
            if (cp.pos === 100) {
                document.getElementById('winnerTitle').innerText = `${playerNames[cp.id]} Menang!`;
                document.getElementById('winModal').classList.add('show');
            } else {
                nextTurn();
            }
        }

        function nextTurn() {
            currentTurn = (currentTurn + 1) % totalPlayers;
            isRolling = false;
            document.getElementById('rollBtn').disabled = false;
            updateUI();
        }

        // Inisialisasi awal
        createBoard();
        updateUI();
    </script>
</body>
</html>
