<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga - Classic Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #4a1515; /* Nuansa klasik merah kecoklatan ala game arcade */
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Container Utama dengan Tata Letak ala Game Klasik */
        .game-layout {
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 4 / 3;
            background: url('https://i.ibb.co.com/84jX2R3/snakes-ladders-board.jpg') center/cover no-repeat; /* Contoh background papan klasik */
            background-color: #8b0000;
            border: 6px solid #d4af37; /* Bingkai emas klasik */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Area Kotak Grid Transparan di atas Gambar Papan */
        .board-grid {
            position: absolute;
            width: 62%; /* Sesuaikan ukuran kotak grid dengan gambar papan di tengah */
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .cell {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 8px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.4); /* Angka tipis transparan di atas gambar */
            padding: 1px;
            position: relative;
        }

        /* Layer Pion */
        .tokens-container {
            position: absolute;
            width: 62%;
            aspect-ratio: 1 / 1;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            z-index: 10;
        }

        .token {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Warna Pion sesuai 4 sudut */
        .p1 { background: #0056b3; } /* Player 1 (Kiri Bawah) - Biru */
        .p2 { background: #d32f2f; } /* Player 2 (Kiri Atas) - Merah */
        .p3 { background: #fbc02d; } /* Player 3 (Kanan Atas) - Kuning */
        .p4 { background: #388e3c; } /* Player 4 (Kanan Bawah) - Hijau */

        /* Panel Pemain di 4 Sudut Luar Papan */
        .player-panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #d4af37;
            color: #333;
            width: 125px;
        }

        .p-box-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .panel-p1 { bottom: 15px; left: 15px; }
        .panel-p2 { top: 15px; left: 15px; }
        .panel-p3 { top: 15px; right: 15px; }
        .panel-p4 { bottom: 15px; right: 15px; }

        .player-info h4 {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.1;
        }

        .player-info p {
            font-size: 10px;
            color: #666;
        }

        /* Tombol Dadu Melayang / Kontrol Tengah Bawah */
        .control-bar {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dice-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .dice-btn:hover { transform: scale(1.05); }
        .dice-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; transform: none; }

        .turn-text {
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
        }

        .back-menu {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            z-index: 20;
        }

        /* Modal Menang */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #2a2d43; padding: 30px; border-radius: 20px; text-align: center;
            width: 85%; max-width: 320px; border: 2px solid #d4af37; color: white;
        }
        .modal-btn {
            background: #2ed573; color: white; border: none; padding: 10px; width: 100%;
            border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <button class="back-menu" onclick="location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Menu</button>

    <!-- Layout Utama Game dengan Desain Kotak Klasik -->
    <div class="game-layout">
        
        <!-- Panel Pemain 2 (Kiri Atas) -->
        <div class="player-panel panel-p2" id="panel-1">
            <div class="p-box-icon" style="background: #d32f2f;"><i class="fa-solid fa-user"></i></div>
            <div class="player-info">
                <h4 id="name-1">Player 2</h4>
                <p id="pos-1">Pos: 1</p>
            </div>
        </div>

        <!-- Panel Pemain 3 (Kanan Atas) -->
        <div class="player-panel panel-p3" id="panel-2">
            <div class="p-box-icon" style="background: #fbc02d;"><i class="fa-solid fa-user"></i></div>
            <div class="player-info">
                <h4 id="name-2">Player 3</h4>
                <p id="pos-2">Pos: 1</p>
            </div>
        </div>

        <!-- Papan Grid Angka 1-100 Transparan di atas Gambar -->
        <div class="board-grid" id="board"></div>
        <div class="tokens-container" id="tokensContainer"></div>

        <!-- Panel Pemain 1 (Kiri Bawah) -->
        <div class="player-panel panel-p1" id="panel-0">
            <div class="p-box-icon" style="background: #0056b3;"><i class="fa-solid fa-user"></i></div>
            <div class="player-info">
                <h4 id="name-0">Player 1</h4>
                <p id="pos-0">Pos: 1</p>
            </div>
        </div>

        <!-- Panel Pemain 4 (Kanan Bawah) -->
        <div class="player-panel panel-p4" id="panel-3">
            <div class="p-box-icon" style="background: #388e3c;"><i class="fa-solid fa-user"></i></div>
            <div class="player-info">
                <h4 id="name-3">Player 4</h4>
                <p id="pos-3">Pos: 1</p>
            </div>
        </div>

    </div>

    <!-- Control Bar Bawah -->
    <div class="control-bar">
        <div class="turn-text" id="turnIndicator">Giliran: Player 1</div>
        <button class="dice-btn" id="rollBtn" onclick="rollDice()"><i class="fa-solid fa-dice"></i> Lempar Dadu</button>
    </div>

    <!-- Modal Menang -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <i class="fa-solid fa-trophy" style="font-size: 45px; color: #ffd700; margin-bottom: 10px;"></i>
            <h2 id="winnerTitle" style="font-size: 20px;">Player 1 Menang!</h2>
            <button class="modal-btn" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script>
        const totalPlayers = parseInt(localStorage.getItem('snake_ladder_players')) || 4;

        // Titik Ular & Tangga Standar Papan 100
        const snakesAndLadders = {
            4: 14, 9: 31, 20: 38, 28: 84, 40: 59, 51: 67, 63: 81, 71: 91, // Tangga
            17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 99: 78 // Ular
        };

        const playerNames = ['Player 1', 'Player 2', 'Player 3', 'Player 4'];
        let players = [];

        for(let i = 0; i < 4; i++) {
            players.push({ id: i, pos: 1 });
            // Sembunyikan panel jika jumlah pemain tidak dipilih (misal cuma main 2 orang)
            if(i >= totalPlayers) {
                document.getElementById(`panel-${i}`).style.display = 'none';
            }
        }

        let currentTurn = 0;
        let isRolling = false;

        function createBoard() {
            const board = document.getElementById('board');
            let cells = [];

            for (let row = 9; row >= 0; row--) {
                let rowCells = [];
                for (let col = 0; col < 10; col++) {
                    let cellNum = (row % 2 === 1) ? (row * 10 + (10 - col)) : (row * 10 + (col + 1));
                    rowCells.push(cellNum);
                }
                cells.push(...rowCells);
            }

            cells.forEach(num => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.id = `cell-${num}`;
                cellDiv.innerHTML = `<span>${num}</span>`;
                board.appendChild(cellDiv);
            });

            updateTokens();
        }

        function getGridCoordinates(pos) {
            let p = pos - 1;
            let row = Math.floor(p / 10);
            let col = p % 10;
            if (row % 2 === 1) col = 9 - col;
            return { row: (9 - row) + 1, col: col + 1 };
        }

        function updateTokens() {
            const container = document.getElementById('tokensContainer');
            container.innerHTML = '';

            players.forEach((player, index) => {
                if (player.id >= totalPlayers) return;
                const coords = getGridCoordinates(player.pos);
                const token = document.createElement('div');
                token.className = `token p${player.id + 1}`;
                
                let offsetX = (index % 2) * 6;
                let offsetY = Math.floor(index / 2) * 6;

                token.style.gridRow = coords.row;
                token.style.gridColumn = coords.col;
                token.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

                container.appendChild(token);
            });
        }

        function updateUI() {
            for(let i = 0; i < totalPlayers; i++) {
                document.getElementById(`pos-${i}`).innerText = `Pos: ${players[i].pos}`;
            }
            document.getElementById('turnIndicator').innerText = `Giliran: ${playerNames[players[currentTurn].id]}`;
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('rollBtn').disabled = true;

            let count = 0;
            let rollInterval = setInterval(() => {
                let tempVal = Math.floor(Math.random() * 6) + 1;
                document.getElementById('turnIndicator').innerText = `Dadu: ${tempVal}...`;
                count++;
                if(count > 8) {
                    clearInterval(rollInterval);
                    let diceVal = Math.floor(Math.random() * 6) + 1;
                    movePlayer(diceVal);
                }
            }, 60);
        }

        function movePlayer(steps) {
            let cp = players[currentTurn];
            let targetPos = cp.pos + steps;

            if (targetPos > 100) {
                nextTurn();
                return;
            }

            cp.pos = targetPos;
            updateTokens();
            updateUI();

            setTimeout(() => {
                if (snakesAndLadders[cp.pos]) {
                    cp.pos = snakesAndLadders[cp.pos];
                    setTimeout(() => {
                        updateTokens();
                        updateUI();
                        checkWin(cp);
                    }, 300);
                } else {
                    checkWin(cp);
                }
            }, 400);
        }

        function checkWin(cp) {
            if (cp.pos === 100) {
                document.getElementById('winnerTitle').innerText = `${playerNames[cp.id]} Menang!`;
                document.getElementById('winModal').classList.add('show');
            } else {
                nextTurn();
            }
        }

        function nextTurn() {
            currentTurn = (currentTurn + 1) % totalPlayers;
            isRolling = false;
            document.getElementById('rollBtn').disabled = false;
            updateUI();
        }

        createBoard();
        updateUI();
    </script>
</body>
</html>
