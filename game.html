<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ular Tangga — Bermain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --cream:#FBF3E3;
    --wood:#8B4A2B;
    --wood-dark:#5E2F17;
    --clay:#D9622B;
    --moss:#4C7A5A;
    --gold:#E8B23B;
    --ink:#2B1B12;
    --paper:#FFFDF8;
    --blue:#5B7FB5;
    --tile-a:#F3E4C8;
    --tile-b:#EAD6AE;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    background:
      radial-gradient(circle at 15% 5%, rgba(232,178,59,0.15), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(76,122,90,0.15), transparent 45%),
      var(--cream);
    color:var(--ink);
    padding:16px;
    padding-bottom:100px;
  }

  .wrap{
    max-width:480px;
    margin:0 auto;
  }

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }

  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border:2px solid var(--wood);
    border-radius:12px;
    padding:8px 12px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--wood-dark);
    text-decoration:none;
    box-shadow:0 3px 0 var(--wood);
    cursor:pointer;
  }
  .back-btn svg{ width:14px; height:14px; }

  h1.title{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--wood-dark);
  }

  .restart-btn{
    background:var(--clay);
    border:2px solid var(--clay);
    border-radius:12px;
    padding:8px 10px;
    box-shadow:0 3px 0 #A6431A;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .restart-btn svg{ width:16px; height:16px; stroke:#fff; }

  /* Players strip */
  .players-strip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:14px;
    padding-bottom:4px;
  }
  .player-chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:2px solid #E4D6C0;
    border-radius:14px;
    padding:8px 12px 8px 8px;
    transition:all 0.2s ease;
  }
  .player-chip.active{
    border-color:var(--gold);
    background:#FFF7E0;
    box-shadow:0 3px 0 var(--gold);
    transform:translateY(-2px);
  }
  .player-chip .dot{
    width:22px; height:22px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .player-chip.p1 .dot{ background:var(--clay); }
  .player-chip.p2 .dot{ background:var(--moss); }
  .player-chip.p3 .dot{ background:var(--gold); }
  .player-chip.p4 .dot{ background:var(--blue); }
  .player-chip .info{ line-height:1.15; }
  .player-chip .name{ font-size:12px; font-weight:700; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis; }
  .player-chip .pos{ font-size:10px; color:#9A8770; font-weight:600; }

  /* Board */
  .board-frame{
    background:var(--paper);
    border:2px solid var(--wood);
    border-radius:20px;
    padding:10px;
    box-shadow:0 8px 0 var(--wood-dark), 0 20px 40px -12px rgba(94,47,23,0.3);
    position:relative;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    grid-template-rows:repeat(10, 1fr);
    gap:2px;
    aspect-ratio:1/1;
    position:relative;
    border-radius:12px;
    overflow:hidden;
    background:var(--wood);
  }

  .tile{
    background:var(--tile-a);
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    padding:3px 4px;
  }
  .tile.alt{ background:var(--tile-b); }
  .tile .tnum{
    font-size:9px;
    font-weight:700;
    color:#B3946B;
    font-family:'Space Grotesk', sans-serif;
  }
  .tile.finish{
    background:var(--moss);
  }
  .tile.finish .tnum{ color:#D7E8DB; }
  .tile.start-tile{ background:#D9E4CF; }

  .tile.snake-head{ box-shadow:inset 0 0 0 2px rgba(217,98,43,0.5); }
  .tile.ladder-bottom{ box-shadow:inset 0 0 0 2px rgba(76,122,90,0.5); }

  svg.overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
  }

  .pawns-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
  }

  .pawn-token{
    position:absolute;
    width:9%;
    height:9%;
    border-radius:50%;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.35);
    transition:left 0.35s ease, top 0.35s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pawn-token::after{
    content:"";
    width:35%; height:35%;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
  }
  .pawn-token.p1{ background:var(--clay); }
  .pawn-token.p2{ background:var(--moss); }
  .pawn-token.p3{ background:var(--gold); }
  .pawn-token.p4{ background:var(--blue); }

  /* Legend */
  .legend{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-top:12px;
    font-size:11px;
    font-weight:600;
    color:#8A7660;
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend .sw{ width:14px; height:3px; border-radius:2px; }
  .legend .sw.snake{ background:var(--clay); }
  .legend .sw.ladder{ background:var(--moss); }

  /* Bottom control bar */
  .control-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--paper);
    border-top:2px solid var(--wood);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:20;
    box-shadow:0 -6px 20px rgba(94,47,23,0.15);
  }

  .turn-info{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:2px solid #E4D6C0;
    border-radius:999px;
    padding:6px 16px 6px 8px;
  }
  .turn-info .turn-dot{
    width:18px; height:18px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .turn-info .turn-dot.p1{ background:var(--clay); }
  .turn-info .turn-dot.p2{ background:var(--moss); }
  .turn-info .turn-dot.p3{ background:var(--gold); }
  .turn-info .turn-dot.p4{ background:var(--blue); }
  .turn-info .lbl{ font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:#9A8770; font-weight:600; line-height:1; }
  .turn-info .val{ font-family:'Fredoka', sans-serif; font-size:15px; font-weight:600; color:var(--wood-dark); line-height:1.3; }

  .dice-btn{
    width:100%;
    max-width:340px;
    height:64px;
    background:linear-gradient(180deg, #FFFFFF, var(--cream));
    border:3px solid var(--wood-dark);
    border-radius:18px;
    box-shadow:0 5px 0 var(--wood-dark);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 20px;
    transition:transform 0.1s ease, box-shadow 0.1s ease;
    flex-shrink:0;
  }
  .dice-btn .dice-face{
    width:38px; height:38px;
    background:var(--clay);
    border-radius:9px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:6px;
    gap:2px;
    flex-shrink:0;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .dice-btn .dice-label{
    font-family:'Fredoka', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--wood-dark);
    letter-spacing:0.01em;
  }
  .dice-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .dice-btn.rolling{
    animation:shake 0.12s infinite;
  }
  .dice-btn.rolling .dice-label{ opacity:0.6; }
  .dice-btn:disabled{
    opacity:0.55;
    cursor:default;
    animation:none;
  }
  @keyframes shake{
    0%{ transform:rotate(0deg); }
    25%{ transform:rotate(-8deg); }
    75%{ transform:rotate(8deg); }
    100%{ transform:rotate(0deg); }
  }

  .pip{
    width:100%; height:100%;
    border-radius:50%;
    background:transparent;
  }
  .pip.on{ background:var(--paper); }

  /* Toast / message */
  .toast{
    position:fixed;
    top:16px; left:50%;
    transform:translate(-50%, -140%);
    background:var(--wood-dark);
    color:var(--cream);
    padding:10px 20px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    z-index:50;
    transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .toast.show{ transform:translate(-50%, 0); }

  /* Win overlay */
  .win-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,27,18,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
    padding:20px;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }

  .win-card{
    background:var(--paper);
    border-radius:24px;
    padding:36px 28px;
    text-align:center;
    max-width:340px;
    width:100%;
    border:2px solid var(--wood);
    transform:scale(0.85);
    transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .win-overlay.show .win-card{ transform:scale(1); }

  .win-crown{ font-size:52px; margin-bottom:8px; }
  .win-card h2{
    font-family:'Fredoka', sans-serif;
    font-size:26px;
    color:var(--wood-dark);
    margin-bottom:6px;
  }
  .win-card p{ font-size:14px; color:#8A7660; margin-bottom:22px; font-weight:500; }

  .win-actions{ display:flex; gap:10px; }
  .win-actions button, .win-actions a{
    flex:1;
    padding:13px;
    border-radius:14px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .win-again{
    background:var(--moss);
    border:none;
    color:#fff;
    box-shadow:0 4px 0 #345740;
  }
  .win-home{
    background:var(--cream);
    border:2px solid var(--wood);
    color:var(--wood-dark);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Menu
    </a>
    <h1 class="title">Ular &amp; Tangga</h1>
    <button class="restart-btn" id="restartBtn" title="Ulangi permainan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
  </div>

  <div class="players-strip" id="playersStrip"></div>

  <div class="board-frame">
    <div class="board" id="board"></div>
    <div class="legend">
      <span><span class="sw ladder"></span> Tangga naik</span>
      <span><span class="sw snake"></span> Ular turun</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="control-bar">
  <div class="turn-info">
    <div class="turn-dot" id="turnDot"></div>
    <div>
      <div class="lbl">Giliran</div>
      <div class="val" id="turnName">—</div>
    </div>
  </div>
  <button class="dice-btn" id="diceBtn">
    <div class="dice-face" id="diceFace">
      <div class="pip" id="p0"></div><div class="pip" id="p1"></div><div class="pip" id="p2"></div>
      <div class="pip" id="p3"></div><div class="pip" id="p4"></div><div class="pip" id="p5"></div>
      <div class="pip" id="p6"></div><div class="pip" id="p7"></div><div class="pip" id="p8"></div>
    </div>
    <span class="dice-label">Lempar Dadu</span>
  </button>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-crown">🏆</div>
    <h2 id="winName">Pemenang!</h2>
    <p>Sampai duluan di kotak 100</p>
    <div class="win-actions">
      <button class="win-again" id="playAgainBtn">Main Lagi</button>
      <a class="win-home" href="index.html">Menu</a>
    </div>
  </div>
</div>

<script>
  // ---------- Setup from URL ----------
  const params = new URLSearchParams(window.location.search);
  const playerCount = Math.min(4, Math.max(2, parseInt(params.get('players')) || 2));
  const colors = ['p1','p2','p3','p4'];
  const players = [];
  for(let i=0;i<playerCount;i++){
    players.push({
      name: params.get('p'+(i+1)) || `Pemain ${i+1}`,
      pos: 0,
      color: colors[i]
    });
  }

  // ---------- Snakes & Ladders map ----------
  // key = start (higher), value = end (lower) for snakes
  const snakes = { 98:78, 95:56, 87:24, 62:19, 54:34, 17:7 };
  // key = start (lower), value = end (higher) for ladders
  const ladders = { 4:25, 13:46, 33:49, 42:63, 50:69, 71:92, 80:99 };

  // ---------- Build board (visual, snake-path numbering 1-100 bottom to top) ----------
  const boardEl = document.getElementById('board');
  // grid positions: row 0 = top (numbers 91-100), row 9 = bottom (1-10)
  // boustrophedon (zig-zag) numbering like real ular tangga board
  const cellNumberToGrid = {}; // number -> {row, col} in 10x10 grid (row0 = top)
  for(let rowFromBottom=0; rowFromBottom<10; rowFromBottom++){
    const rowNumbers = [];
    const base = rowFromBottom*10;
    for(let c=0;c<10;c++) rowNumbers.push(base + c + 1);
    if(rowFromBottom % 2 === 1) rowNumbers.reverse(); // zig-zag
    const gridRow = 9 - rowFromBottom; // row0 at top visually
    rowNumbers.forEach((num, colIdx)=>{
      cellNumberToGrid[num] = { row: gridRow, col: colIdx };
    });
  }

  // Render tiles in DOM order (row major, row0 top)
  const gridToNumber = {};
  Object.entries(cellNumberToGrid).forEach(([num,pos])=>{
    gridToNumber[`${pos.row}-${pos.col}`] = parseInt(num);
  });

  for(let r=0;r<10;r++){
    for(let c=0;c<10;c++){
      const num = gridToNumber[`${r}-${c}`];
      const tile = document.createElement('div');
      tile.className = 'tile' + ((Math.floor(num/1)+r+c)%2===0 ? '' : ' alt');
      if(num === 100) tile.classList.add('finish');
      if(num === 1) tile.classList.add('start-tile');
      if(snakes[num]) tile.classList.add('snake-head');
      if(ladders[num]) tile.classList.add('ladder-bottom');
      tile.dataset.num = num;
      tile.innerHTML = `<span class="tnum">${num}</span>`;
      boardEl.appendChild(tile);
    }
  }

  // SVG overlay for snakes & ladders lines
  const svgNS = "http://www.w3.org/2000/svg";
  const overlay = document.createElementNS(svgNS,"svg");
  overlay.setAttribute("class","overlay");
  overlay.setAttribute("viewBox","0 0 100 100");
  overlay.setAttribute("preserveAspectRatio","none");
  boardEl.appendChild(overlay);

  function centerOf(num){
    const pos = cellNumberToGrid[num];
    return { x: pos.col*10 + 5, y: pos.row*10 + 5 };
  }

  function drawLadder(fromNum, toNum){
    // fromNum = bottom of ladder, toNum = top of ladder
    const a = centerOf(fromNum);
    const b = centerOf(toNum);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = dx/len, uy = dy/len; // unit vector along ladder
    const px = -uy, py = ux; // perpendicular unit vector
    const railGap = 2.6; // distance between the two rails

    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("opacity","0.92");

    // two rails
    [-1, 1].forEach(side=>{
      const x1 = a.x + px*railGap*side;
      const y1 = a.y + py*railGap*side;
      const x2 = b.x + px*railGap*side;
      const y2 = b.y + py*railGap*side;
      const rail = document.createElementNS(svgNS,"line");
      rail.setAttribute("x1", x1); rail.setAttribute("y1", y1);
      rail.setAttribute("x2", x2); rail.setAttribute("y2", y2);
      rail.setAttribute("stroke", "#3E6449");
      rail.setAttribute("stroke-width", "1.3");
      rail.setAttribute("stroke-linecap","round");
      g.appendChild(rail);
    });

    // rungs (anak tangga)
    const rungCount = Math.max(3, Math.round(len/9));
    for(let i=1;i<rungCount;i++){
      const t = i/rungCount;
      const cx = a.x + dx*t;
      const cy = a.y + dy*t;
      const x1 = cx + px*railGap;
      const y1 = cy + py*railGap;
      const x2 = cx - px*railGap;
      const y2 = cy - py*railGap;
      const rung = document.createElementNS(svgNS,"line");
      rung.setAttribute("x1", x1); rung.setAttribute("y1", y1);
      rung.setAttribute("x2", x2); rung.setAttribute("y2", y2);
      rung.setAttribute("stroke", "#4C7A5A");
      rung.setAttribute("stroke-width", "1.1");
      rung.setAttribute("stroke-linecap","round");
      g.appendChild(rung);
    }

    overlay.appendChild(g);
  }

  function drawSnake(fromNum, toNum){
    // fromNum = head (higher number), toNum = tail (lower number, destination)
    const a = centerOf(fromNum); // head
    const b = centerOf(toNum);   // tail
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = dx/len, uy = dy/len;
    const px = -uy, py = ux;

    // build a wavy path from head to tail using several waypoints
    const segments = Math.max(4, Math.round(len/10));
    const amp = 4.5;
    let d = `M ${a.x} ${a.y}`;
    const pts = [{x:a.x,y:a.y}];
    for(let i=1;i<=segments;i++){
      const t = i/segments;
      const bx = a.x + dx*t;
      const by = a.y + dy*t;
      const wave = Math.sin(t*Math.PI*2.4) * amp * (1 - t*0.3);
      pts.push({ x:bx + px*wave, y:by + py*wave });
    }
    for(let i=1;i<pts.length-1;i++){
      const midx=(pts[i].x+pts[i+1].x)/2, midy=(pts[i].y+pts[i+1].y)/2;
      d += ` Q ${pts[i].x} ${pts[i].y} ${midx} ${midy}`;
    }
    d += ` T ${pts[pts.length-1].x} ${pts[pts.length-1].y}`;

    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("opacity","0.92");

    const body = document.createElementNS(svgNS,"path");
    body.setAttribute("d", d);
    body.setAttribute("stroke", "#D9622B");
    body.setAttribute("stroke-width", "2.1");
    body.setAttribute("fill", "none");
    body.setAttribute("stroke-linecap","round");
    g.appendChild(body);

    // subtle darker belly stripe
    const stripe = document.createElementNS(svgNS,"path");
    stripe.setAttribute("d", d);
    stripe.setAttribute("stroke", "#B84A1C");
    stripe.setAttribute("stroke-width", "0.6");
    stripe.setAttribute("fill", "none");
    stripe.setAttribute("stroke-dasharray","1.2,2.4");
    stripe.setAttribute("stroke-linecap","round");
    g.appendChild(stripe);

    // head (triangle-ish dot with eyes) at 'a'
    const head = document.createElementNS(svgNS,"circle");
    head.setAttribute("cx", a.x); head.setAttribute("cy", a.y);
    head.setAttribute("r", 2.6);
    head.setAttribute("fill", "#D9622B");
    g.appendChild(head);
    [-0.9, 0.9].forEach(off=>{
      const eye = document.createElementNS(svgNS,"circle");
      eye.setAttribute("cx", a.x + px*off*0.9);
      eye.setAttribute("cy", a.y + py*off*0.9);
      eye.setAttribute("r", 0.5);
      eye.setAttribute("fill", "#2B1B12");
      g.appendChild(eye);
    });

    // tail tip marker
    const tail = document.createElementNS(svgNS,"circle");
    tail.setAttribute("cx", b.x); tail.setAttribute("cy", b.y);
    tail.setAttribute("r", 1.4);
    tail.setAttribute("fill", "#B84A1C");
    g.appendChild(tail);

    overlay.appendChild(g);
  }

  Object.entries(snakes).forEach(([from,to])=> drawSnake(parseInt(from), to));
  Object.entries(ladders).forEach(([from,to])=> drawLadder(parseInt(from), to));

  // ---------- Pawns layer ----------
  const pawnsLayer = document.createElement('div');
  pawnsLayer.className = 'pawns-layer';
  boardEl.appendChild(pawnsLayer);

  const pawnEls = players.map((p, i)=>{
    const el = document.createElement('div');
    el.className = `pawn-token ${p.color}`;
    pawnsLayer.appendChild(el);
    return el;
  });

  function pawnOffset(playerIdx, totalOnTile){
    // small offset so multiple pawns on same tile don't fully overlap
    const offsets = [
      [0,0], [22,0], [0,22], [22,22]
    ];
    return offsets[playerIdx % 4];
  }

  function updatePawnPositions(){
    // group players by position to offset them
    const byPos = {};
    players.forEach((p, i)=>{
      byPos[p.pos] = byPos[p.pos] || [];
      byPos[p.pos].push(i);
    });

    players.forEach((p, i)=>{
      const num = p.pos === 0 ? 1 : p.pos; // show at tile 1 before starting
      const pos = centerOf(num);
      const group = byPos[p.pos];
      const slot = group.indexOf(i);
      const [ox, oy] = pawnOffset(slot, group.length);
      const baseXPercent = pos.x - 5 + (ox/100)*3;
      const baseYPercent = pos.y - 5 + (oy/100)*3;
      pawnEls[i].style.left = `calc(${baseXPercent}% + 2px)`;
      pawnEls[i].style.top = `calc(${baseYPercent}% + 2px)`;
      pawnEls[i].style.opacity = p.pos === 0 ? '0.55' : '1';
    });
  }

  // ---------- Players strip UI ----------
  const stripEl = document.getElementById('playersStrip');
  function renderStrip(){
    stripEl.innerHTML = '';
    players.forEach((p, i)=>{
      const chip = document.createElement('div');
      chip.className = `player-chip ${p.color}` + (i===currentIdx ? ' active' : '');
      chip.innerHTML = `<div class="dot"></div><div class="info"><div class="name">${escapeHtml(p.name)}</div><div class="pos">Kotak ${p.pos}</div></div>`;
      stripEl.appendChild(chip);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Game state ----------
  let currentIdx = 0;
  let isAnimating = false;
  let gameOver = false;

  const diceBtn = document.getElementById('diceBtn');
  const turnNameEl = document.getElementById('turnName');
  const turnDotEl = document.getElementById('turnDot');
  const toastEl = document.getElementById('toast');
  const winOverlay = document.getElementById('winOverlay');
  const winName = document.getElementById('winName');

  const pipPatterns = {
    1:[4],
    2:[0,8],
    3:[0,4,8],
    4:[0,2,6,8],
    5:[0,2,4,6,8],
    6:[0,2,3,5,6,8]
  };
  const pips = [0,1,2,3,4,5,6,7,8].map(i=>document.getElementById('p'+i));

  function showDiceFace(n){
    pips.forEach(p=>p.classList.remove('on'));
    pipPatterns[n].forEach(idx=> pips[idx].classList.add('on'));
  }

  function showToast(msg, duration=1600){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), duration);
  }

  function updateTurnUI(){
    turnNameEl.textContent = players[currentIdx].name;
    turnDotEl.className = 'turn-dot ' + players[currentIdx].color;
    renderStrip();
  }

  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function rollDice(){
    if(isAnimating || gameOver) return;
    isAnimating = true;
    diceBtn.disabled = true;
    diceBtn.classList.add('rolling');

    // shake animation with random faces
    const shakeFrames = 10;
    for(let i=0;i<shakeFrames;i++){
      showDiceFace(1 + Math.floor(Math.random()*6));
      await sleep(60);
    }
    diceBtn.classList.remove('rolling');

    const roll = 1 + Math.floor(Math.random()*6);
    showDiceFace(roll);

    await sleep(200);
    await movePlayer(currentIdx, roll);

    isAnimating = false;
    if(!gameOver){
      diceBtn.disabled = false;
    }
  }

  async function movePlayer(idx, steps){
    const p = players[idx];
    let target = p.pos + steps;

    if(target > 100){
      showToast(`${p.name} butuh angka pas untuk ke 100!`);
      updateTurnUI();
      await sleep(900);
      nextTurn();
      return;
    }

    // step-by-step animate along the path
    const start = p.pos === 0 ? 0 : p.pos;
    for(let s = start+1; s <= target; s++){
      p.pos = s;
      updatePawnPositions();
      renderStrip();
      await sleep(140);
    }

    // check ladder or snake
    await sleep(150);
    if(ladders[target]){
      const dest = ladders[target];
      showToast(`🪜 ${p.name} naik tangga ke ${dest}!`);
      await sleep(500);
      p.pos = dest;
      updatePawnPositions();
      renderStrip();
    } else if(snakes[target]){
      const dest = snakes[target];
      showToast(`🐍 ${p.name} digigit ular, turun ke ${dest}!`);
      await sleep(500);
      p.pos = dest;
      updatePawnPositions();
      renderStrip();
    }

    await sleep(300);

    if(p.pos === 100){
      endGame(p);
      return;
    }

    nextTurn();
  }

  function nextTurn(){
    currentIdx = (currentIdx + 1) % players.length;
    updateTurnUI();
  }

  function endGame(winner){
    gameOver = true;
    diceBtn.disabled = true;
    winName.textContent = `${winner.name} Menang! 🎉`;
    winOverlay.classList.add('show');
  }

  diceBtn.addEventListener('click', rollDice);

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    if(confirm('Ulangi permainan dari awal?')) resetGame();
  });
  document.getElementById('playAgainBtn').addEventListener('click', resetGame);

  function resetGame(){
    players.forEach(p=> p.pos = 0);
    currentIdx = 0;
    gameOver = false;
    isAnimating = false;
    diceBtn.disabled = false;
    winOverlay.classList.remove('show');
    showDiceFace(1);
    updatePawnPositions();
    updateTurnUI();
  }

  // ---------- Init ----------
  showDiceFace(1);
  updatePawnPositions();
  updateTurnUI();
</script>

</body>
</html>
