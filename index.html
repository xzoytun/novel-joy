<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ular Tangga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #2b5a3a, #1d3e2a);
            padding: 20px;
        }
        .menu-card {
            background: #f8f0e3;
            padding: 40px 50px;
            border-radius: 60px 60px 60px 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 8px solid #d4a373;
        }
        h1 {
            font-size: 3em;
            color: #3c6e47;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2em;
            color: #5a3e2b;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .player-select {
            margin: 25px 0;
        }
        .player-select label {
            font-size: 1.2em;
            font-weight: 600;
            color: #3c2a1f;
            display: block;
            margin-bottom: 12px;
        }
        .player-select select {
            padding: 12px 20px;
            font-size: 1.2em;
            border-radius: 30px;
            border: 2px solid #b08968;
            background: white;
            width: 80%;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .player-select select:focus {
            border-color: #6b8c5c;
            box-shadow: 0 0 0 3px rgba(107, 140, 92, 0.3);
        }
        .btn-start {
            background: #d4a373;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.6em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 6px 0 #8b6b4b;
            width: 100%;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #8b6b4b;
            background: #c4956a;
        }
        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b6b4b;
        }
        .footer {
            margin-top: 25px;
            color: #7a5f47;
            font-size: 0.9em;
        }
        @media (max-width: 500px) {
            .menu-card { padding: 30px 20px; }
            h1 { font-size: 2.4em; }
        }
    </style>
</head>
<body>
    <div class="menu-card">
        <h1>🐍 Ular Tangga 🎲</h1>
        <p class="subtitle">Selamat datang di permainan klasik!</p>
        <div class="player-select">
            <label for="playerCount">Pilih jumlah pemain :</label>
            <select id="playerCount">
                <option value="2">2 Pemain</option>
                <option value="3">3 Pemain</option>
                <option value="4">4 Pemain</option>
            </select>
        </div>
        <button class="btn-start" id="startBtn">Mulai Permainan</button>
        <div class="footer">🎯 Siapkan dadu dan nikmati serunya!</div>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            const count = document.getElementById('playerCount').value;
            window.location.href = `game.html?players=${count}`;
        });
    </script>
</body>
</html>
