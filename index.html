<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekar Untukmu 🌸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2d1b36, #0f0a12);
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Container Bunga */
        .flower-container {
            position: relative;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.3s;
        }

        /* Bentuk Bunga (Mekar) */
        .flower {
            width: 100px;
            height: 100px;
            background: #ff758c;
            border-radius: 50%;
            position: relative;
            animation: bloom 3s infinite alternate ease-in-out, glow 2s infinite alternate;
        }

        .flower::before, .flower::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: #ff758c;
            border-radius: 50%;
            top: 0; left: 0;
        }

        .flower::before { transform: rotate(60deg); }
        .flower::after { transform: rotate(120deg); }

        /* Pusat Bunga */
        .core {
            position: absolute;
            top: 25px; left: 25px;
            width: 50px; height: 50px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 15px #ffeb3b;
        }

        /* Teks */
        .text-container {
            margin-top: 50px;
            text-align: center;
            color: #fff;
            opacity: 0;
            transition: opacity 1s;
        }

        .show { opacity: 1; }

        /* Animasi */
        @keyframes bloom {
            0% { transform: scale(0.6) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1) rotate(45deg); opacity: 1; }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px #ff758c, 0 0 20px #ff758c; }
            100% { box-shadow: 0 0 30px #ff758c, 0 0 50px #ff758c; }
        }
    </style>
</head>
<body>

    <div class="flower-container" onclick="mekar()">
        <div class="flower">
            <div class="core"></div>
        </div>
        <div id="text" class="text-container">
            <h1 id="title">Sentuh Bunganya ✨</h1>
            <p id="msg">Seperti bunga ini, cintaku mekar untukmu setiap hari.</p>
        </div>
    </div>

    <script>
        function mekar() {
            document.getElementById('text').classList.add('show');
            document.getElementById('title').innerText = "Kamu Berharga 🌸";
        }
    </script>
</body>
</html>
