<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catur — Classic Chess</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --ivory: #EDE7D9;
            --ivory-dim: #C9C0AC;
            --board-dark: #201B17;
            --board-dark-2: #171310;
            --walnut: #3A2E24;
            --gold: #B9873D;
            --gold-bright: #E4B368;
            --line: rgba(237, 231, 217, 0.1);
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--board-dark-2);
            font-family: 'Inter', sans-serif;
            padding: 10px;
            margin: 0;
            color: var(--ivory);
            position: relative;
            overflow-x: hidden;
        }

        /* Faint chessboard texture across the whole viewport */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(237,231,217,0.025) 25%, transparent 25%, transparent 75%, rgba(237,231,217,0.025) 75%),
                linear-gradient(45deg, rgba(237,231,217,0.025) 25%, transparent 25%, transparent 75%, rgba(237,231,217,0.025) 75%);
            background-size: 88px 88px;
            background-position: 0 0, 44px 44px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 900px 700px at 50% 0%, rgba(185,135,61,0.09), transparent 65%);
            pointer-events: none;
        }

        .card {
            max-width: 460px;
            width: 100%;
            position: relative;
            text-align: center;
            padding: 56px 40px 44px;
            background: linear-gradient(180deg, rgba(58,46,36,0.5), rgba(32,27,23,0.7));
            border-radius: 4px;
            border: 1px solid var(--line);
            box-shadow:
                0 40px 90px rgba(0,0,0,0.55),
                0 0 0 1px rgba(185,135,61,0.06);
            z-index: 1;
        }

        /* corner ticks like a board's coordinate marks */
        .card::before,
        .card::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border: 1px solid var(--gold);
            opacity: 0.55;
        }
        .card::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        .card::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .rank-file {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--gold-bright);
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 28px;
        }

        .crest {
            font-size: 46px;
            line-height: 1;
            color: var(--ivory);
            margin-bottom: 18px;
            filter: drop-shadow(0 6px 18px rgba(228,179,104,0.25));
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 52px;
            letter-spacing: 0.5px;
            color: var(--ivory);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-bright);
            margin-bottom: 26px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 26px;
        }

        .desc {
            font-size: 15.5px;
            line-height: 1.75;
            color: var(--ivory-dim);
            max-width: 340px;
            margin: 0 auto 34px;
            font-weight: 400;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 38px;
            flex-wrap: wrap;
        }

        .features span {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--ivory-dim);
            padding: 8px 16px;
            border-radius: 3px;
            border: 1px solid var(--line);
            background: rgba(237,231,217,0.02);
            letter-spacing: 0.2px;
        }

        .btn-start {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--board-dark-2);
            background: linear-gradient(180deg, var(--gold-bright), var(--gold));
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            letter-spacing: 0.4px;
            box-shadow: 0 10px 26px rgba(185,135,61,0.28);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(185,135,61,0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .btn-start:hover svg {
            transform: translateX(3px);
        }

        .footer {
            margin-top: 26px;
            color: rgba(237,231,217,0.25);
            font-size: 11.5px;
            letter-spacing: 2px;
        }

        @media (max-width: 640px) {
            body {
                padding: 6px;
                align-items: center;
            }
        }

        @media (max-width: 520px) {
            .card {
                padding: 44px 26px 34px;
                margin-top: 12px;
            }
            h1 {
                font-size: 40px;
            }
            .crest {
                font-size: 36px;
            }
            .desc {
                font-size: 14.5px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(237,231,217,0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <p class="rank-file">e4 · e5</p>
        <div class="crest">♚</div>
        <h1>Catur</h1>
        <p class="subtitle">Classic Chess</p>
        <div class="divider"></div>
        <p class="desc">
            Tantang diri Anda dalam permainan strategi abadi.
            Mainkan melawan teman di layar yang sama.
        </p>
        <div class="features">
            <span>2 Pemain</span>
            <span>Aturan Lengkap</span>
            <span>Anti-kesalahan</span>
        </div>
        <a href="game.html" class="btn-start">
            Mulai Bermain
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <p class="footer">— 2026 —</p>
    </div>

</body>
</html>
