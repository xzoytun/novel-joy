<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuKita - Dompet Digital Profesional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    SK
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-white">SakuKita</h1>
                    <p class="text-[11px] text-slate-400">Financial Tracker</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                    Sistem Aktif
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow space-y-6">
        
        <!-- Kartu Ringkasan Saldo (Hero Card) -->
        <div class="bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 p-6 rounded-3xl border border-indigo-500/20 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                <div>
                    <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold">Total Saldo Tersedia</span>
                    <h2 id="saldo-total" class="text-3xl md:text-4xl font-extrabold text-white mt-1 tracking-tight">Rp 0</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleFormMobile()" class="md:hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/30">
                        + Catat Transaksi
                    </button>
                    <button onclick="resetData()" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 px-3 py-2.5 rounded-xl font-medium transition">
                        Reset Data
                    </button>
                </div>
            </div>

            <!-- Pemasukan & Pengeluaran Kecil di Dalam Hero Card -->
            <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-800/80 relative z-10">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-sm">
                        ↓
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-medium">Pemasukan</span>
                        <span id="total-pemasukan" class="text-sm md:text-base font-bold text-emerald-400">Rp 0</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 font-bold text-sm">
                        ↑
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-medium">Pengeluaran</span>
                        <span id="total-pengeluaran" class="text-sm md:text-base font-bold text-rose-400">Rp 0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid Bagian Form & Riwayat -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Form Tambah Transaksi -->
            <div id="form-container" class="bg-slate-800/50 backdrop-blur-sm p-5 rounded-3xl border border-slate-800 h-fit shadow-lg">
                <h3 class="font-bold text-white mb-4 text-sm flex items-center">
                    <svg class="w-4 h-4 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Catat Transaksi Baru
                </h3>
                <form id="form-transaksi" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Keterangan</label>
                        <input type="text" id="keterangan" required placeholder="Contoh: Gaji Bulanan, Kopi" 
                            class="w-full px-3.5 py-2.5 text-sm bg-slate-900 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nominal (Rp)</label>
                        <input type="number" id="nominal" required placeholder="Contoh: 50000" 
                            class="w-full px-3.5 py-2.5 text-sm bg-slate-900 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Jenis Transaksi</label>
                        <select id="tipe" class="w-full px-3.5 py-2.5 text-sm bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            <option value="pemasukan">Pemasukan (+)</option>
                            <option value="pengeluaran">Pengeluaran (-)</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition duration-200 shadow-lg shadow-indigo-600/20">
                        Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Daftar Riwayat Transaksi -->
            <div class="md:col-span-2 bg-slate-800/50 backdrop-blur-sm p-5 rounded-3xl border border-slate-800 shadow-lg flex flex-col justify-between">
               <div>
                    <!-- Header Riwayat & Filter -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <h3 class="font-bold text-white text-sm">Riwayat Transaksi</h3>
                        
                        <!-- Filter Tombol -->
                        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700/60 text-xs font-medium w-full sm:w-auto">
                            <button onclick="setFilter('semua')" id="btn-semua" class="flex-1 sm:flex-none px-3 py-1 rounded-lg bg-indigo-600 text-white transition">Semua</button>
                            <button onclick="setFilter('pemasukan')" id="btn-pemasukan" class="flex-1 sm:flex-none px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">Masuk</button>
                            <button onclick="setFilter('pengeluaran')" id="btn-pengeluaran" class="flex-1 sm:flex-none px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">Keluar</button>
                        </div>
                    </div>
                    
                    <!-- List Item -->
                    <div class="overflow-x-auto max-h-[360px] overflow-y-auto pr-1">
                        <ul id="list-transaksi" class="space-y-2.5">
                            <p id="pesan-kosong" class="text-sm text-slate-500 text-center py-12">Belum ada transaksi tercatat.</p>
                        </ul>
                    </div>
               </div>
               
               <div class="mt-4 pt-3 border-t border-slate-800 text-[11px] text-slate-500 text-center">
                    Data disimpan secara aman di browser lokal Anda (LocalStorage)
               </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-6">
        &copy; 2026 SakuKita. All rights reserved.
    </footer>

    <!-- Script Javascript -->
    <script>
        let transaksiList = JSON.parse(localStorage.getItem('transaksi')) || [];
        let filterAktif = 'semua';

        const form = document.getElementById('form-transaksi');
        const keteranganInput = document.getElementById('keterangan');
        const nominalInput = document.getElementById('nominal');
        const tipeInput = document.getElementById('tipe');
        
        const saldoTotalEl = document.getElementById('saldo-total');
        const totalPemasukanEl = document.getElementById('total-pemasukan');
        const totalPengeluaranEl = document.getElementById('total-pengeluaran');
        const listTransaksiEl = document.getElementById('list-transaksi');
        const pesanKosongEl = document.getElementById('pesan-kosong');

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function setFilter(tipe) {
            filterAktif = tipe;
            ['semua', 'pemasukan', 'pengeluaran'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === tipe) {
                    btn.className = "flex-1 sm:flex-none px-3 py-1 rounded-lg bg-indigo-600 text-white transition";
                } else {
                    btn.className = "flex-1 sm:flex-none px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                }
            });
            updateAplikasi();
        }

        function updateAplikasi() {
            listTransaksiEl.innerHTML = '';
            let pemasukan = 0;
            let pengeluaran = 0;

            // Hitung total keseluruhan dulu
            transaksiList.forEach(item => {
                if (item.tipe === 'pemasukan') {
                    pemasukan += Number(item.nominal);
                } else {
                    pengeluaran += Number(item.nominal);
                }
            });

            // Filter data untuk ditampilkan
            let dataDitampilkan = transaksiList.filter(item => {
                if (filterAktif === 'pemasukan') return item.tipe === 'pemasukan';
                if (filterAktif === 'pengeluaran') return item.tipe === 'pengeluaran';
                return true;
            });

            if (dataDitampilkan.length === 0) {
                pesanKosongEl.style.display = 'block';
                listTransaksiEl.appendChild(pesanKosongEl);
            } else {
                pesanKosongEl.style.display = 'none';
                
                dataDitampilkan.forEach((item) => {
                    // Cari indeks asli di array utama agar tombol hapus tepat sasaran
                    const indexAsli = transaksiList.indexOf(item);

                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center p-3 bg-slate-900/60 border border-slate-800/80 rounded-2xl hover:bg-slate-900 transition";
                    
                    const isMasuk = item.tipe === 'pemasukan';
                    const warnaTeks = isMasuk ? 'text-emerald-400' : 'text-rose-400';
                    const tanda = isMasuk ? '+' : '-';

                    li.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl flex items-center justify-center ${isMasuk ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'} font-bold text-sm">
                                ${isMasuk ? '↓' : '↑'}
                            </div>
                            <div>
                                <h4 class="text-xs md:text-sm font-semibold text-slate-200">${item.keterangan}</h4>
                                <span class="text-[10px] text-slate-500">${item.tanggal || 'Baru saja'}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs md:text-sm font-bold ${warnaTeks}">
                                ${tanda} ${formatRupiah(item.nominal)}
                            </span>
                            <button onclick="hapusTransaksi(${indexAsli})" class="text-slate-600 hover:text-rose-400 p-1.5 transition rounded-lg hover:bg-rose-500/10">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    listTransaksiEl.appendChild(li);
                });
            }

            let saldoTotal = pemasukan - pengeluaran;

            saldoTotalEl.innerText = formatRupiah(saldoTotal);
            totalPemasukanEl.innerText = formatRupiah(pemasukan);
            totalPengeluaranEl.innerText = formatRupiah(pengeluaran);

            localStorage.setItem('transaksi', JSON.stringify(transaksiList));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const tanggalBaru = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const transaksiBaru = {
                keterangan: keteranganInput.value,
                nominal: parseFloat(nominalInput.value),
                tipe: tipeInput.value,
                tanggal: tanggalBaru
            };

            transaksiList.unshift(transaksiBaru);
            updateAplikasi();

            keteranganInput.value = '';
            nominalInput.value = '';
            keteranganInput.focus();
        });

        function hapusTransaksi(index) {
            transaksiList.splice(index, 1);
            updateAplikasi();
        }

        function resetData() {
            if (confirm("Yakin ingin menghapus seluruh data transaksi?")) {
                transaksiList = [];
                updateAplikasi();
            }
        }

        updateAplikasi();
    </script>
</body>
</html>
