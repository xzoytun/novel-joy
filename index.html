<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemandangan Taman Bunga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Kontainer Utama dengan Gradasi Langit ke Padang Rumput */
        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #7ac1eb 0%, #cce7f0 55%, #a8e6cf 100%);
            overflow: hidden;
        }

        /* Efek Matahari Bersinar di Atas Kanan */
        .sun {
            position: absolute;
            top: 40px;
            right: 60px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff3b0 0%, #ffcc00 60%, #ff9800 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px #ffeb3b, 0 0 100px rgba(255, 152, 0, 0.6);
        }

        /* Kupu-kupu Utama yang Terbang */
        .butterfly {
            position: absolute;
            top: 32%;
            left: 42%;
            font-size: 45px;
            animation: flyAround 5s ease-in-out infinite;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            z-index: 10;
        }

        @keyframes flyAround {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(-10deg);
            }
            25% {
                transform: translateY(-25px) translateX(15px) rotate(5deg);
            }
            50% {
                transform: translateY(-10px) translateX(-10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) translateX(10px) rotate(10deg);
            }
        }

        /* Area Rumput & Tanaman di Bagian Bawah */
        .meadow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, #2d6a4f, #52b788);
            border-radius: 60% 60% 0 0 / 25% 25% 0 0;
            box-shadow: inset 0 20px 20px rgba(0, 20, 0, 0.1);
        }

        /* Hiasan Bunga-bunga di Rumput */
        .flowers-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 20px;
            font-size: 35px;
            z-index: 5;
        }

        .flower {
            animation: sway 3s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        .flower:nth-child(even) {
            animation-duration: 3.5s;
            animation-direction: alternate-reverse;
        }

        @keyframes sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Matahari -->
        <div class="sun"></div>

        <!-- Kupu-kupu yang bergerak -->
        <div class="butterfly">🦋</div>

        <!-- Padang Rumput -->
        <div class="meadow"></div>

        <!-- Barisan Bunga di Bawah -->
        <div class="flowers-container">
            <span class="flower">🌸</span>
            <span class="flower">🌻</span>
            <span class="flower">🌷</span>
            <span class="flower">🌺</span>
            <span class="flower">🌹</span>
            <span class="flower">🌻</span>
            <span class="flower">🌸</span>
        </div>
    </div>

</body>
</html>
