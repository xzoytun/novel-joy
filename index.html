<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taman Bunga Bermekaran 🌸</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #b5dffa 35%, #8bc9e8 50%, #7ec8a0 75%, #5daa7a 85%, #3d8b5e 100%);
            user-select: none;
        }

        /* ===== LANGIT & MATAHARI ===== */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: radial-gradient(ellipse at 75% 15%, #fff9e6 0%, #ffecb0 15%, #f5d68a 30%, transparent 60%);
            opacity: 0.5;
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 6%;
            right: 12%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff7b0, #ffd93d);
            border-radius: 50%;
            box-shadow: 0 0 120px 40px rgba(255, 215, 0, 0.5), 0 0 60px 20px rgba(255, 200, 50, 0.3);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 120px 40px rgba(255, 215, 0, 0.5);
            }
            100% {
                transform: scale(1.05);
                box-shadow: 0 0 160px 60px rgba(255, 215, 0, 0.7);
            }
        }

        /* ===== AWAN ===== */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 100px;
            filter: blur(1px);
            animation: floatCloud linear infinite alternate;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: inherit;
        }
        .cloud-1 {
            width: 180px;
            height: 50px;
            top: 8%;
            left: -5%;
            animation-duration: 28s;
        }
        .cloud-1::before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 25px;
        }
        .cloud-1::after {
            width: 100px;
            height: 80px;
            top: -40px;
            left: 70px;
        }

        .cloud-2 {
            width: 220px;
            height: 55px;
            top: 18%;
            left: 30%;
            animation-duration: 34s;
            animation-delay: -8s;
            opacity: 0.7;
        }
        .cloud-2::before {
            width: 90px;
            height: 80px;
            top: -40px;
            left: 30px;
        }
        .cloud-2::after {
            width: 120px;
            height: 90px;
            top: -45px;
            left: 90px;
        }

        .cloud-3 {
            width: 150px;
            height: 40px;
            top: 5%;
            left: 65%;
            animation-duration: 32s;
            animation-delay: -16s;
            opacity: 0.6;
        }
        .cloud-3::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }
        .cloud-3::after {
            width: 80px;
            height: 70px;
            top: -35px;
            left: 60px;
        }

        @keyframes floatCloud {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(180px);
            }
        }

        /* ===== RUMPUT ===== */
        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 38%;
            background:
                repeating-linear-gradient(90deg,
                    transparent 0px,
                    transparent 8px,
                    rgba(34, 120, 50, 0.15) 8px,
                    rgba(34, 120, 50, 0.15) 10px);
            pointer-events: none;
            z-index: 0;
        }
        .grass::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 10% 100%, rgba(60, 160, 80, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 100%, rgba(50, 140, 70, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(70, 180, 90, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== BUNGA ===== */
        .flower-container {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 70%;
            pointer-events: none;
            z-index: 1;
        }

        .flower {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            animation: growFlower 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .flower .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to top, #2d7a3a, #4a9e5a);
            border-radius: 2px;
            transform: translateX(-50%);
            animation: growStem 1.4s ease-out forwards;
            animation-delay: 0.2s;
        }

        .flower .head {
            position: absolute;
            bottom: var(--stem-height, 70px);
            left: 50%;
            transform: translateX(-50%) scale(0);
            animation: bloom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.6s;
        }

        /* Kelopak */
        .flower .petal {
            position: absolute;
            border-radius: 50% 50% 0 50%;
            transform-origin: center 90%;
            opacity: 0;
            animation: petalAppear 0.6s ease-out forwards;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        @keyframes growStem {
            0% {
                height: 0;
            }
            100% {
                height: var(--stem-height, 70px);
            }
        }

        @keyframes growFlower {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes bloom {
            0% {
                transform: translateX(-50%) scale(0) rotate(-10deg);
            }
            60% {
                transform: translateX(-50%) scale(1.2) rotate(4deg);
            }
            100% {
                transform: translateX(-50%) scale(1) rotate(0deg);
            }
        }

        @keyframes petalAppear {
            0% {
                opacity: 0;
                transform: rotate(var(--rot)) scale(0) translateY(0);
            }
            100% {
                opacity: 1;
                transform: rotate(var(--rot)) scale(1) translateY(0);
            }
        }

        /* Animasi goyang bunga */
        .flower.swing {
            animation: swingFlower 4s ease-in-out infinite alternate;
        }

        @keyframes swingFlower {
            0% {
                transform: rotate(-3deg);
            }
            100% {
                transform: rotate(3deg);
            }
        }

        /* ===== KUPU-KUPU ===== */
        .butterfly {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            animation: flyButterfly var(--fly-duration, 12s) linear infinite;
        }

        .butterfly .wing {
            position: absolute;
            width: 28px;
            height: 32px;
            border-radius: 50% 50% 20% 50%;
            transform-origin: 50% 50%;
            background: radial-gradient(ellipse at 40% 30%, #ff7eb3, #d63384);
            box-shadow: 0 0 12px rgba(214, 51, 132, 0.3);
            animation: flapWing 0.3s ease-in-out infinite alternate;
        }
        .butterfly .wing-left {
            transform: rotate(20deg) translateX(-10px);
            border-radius: 50% 50% 50% 20%;
            background: radial-gradient(ellipse at 60% 30%, #ff7eb3, #c72a7a);
        }
        .butterfly .wing-right {
            transform: rotate(-20deg) translateX(10px);
        }
        .butterfly .body {
            position: absolute;
            width: 4px;
            height: 18px;
            background: #2d1b1b;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .butterfly .antenna {
            position: absolute;
            width: 1.5px;
            height: 12px;
            background: #2d1b1b;
            border-radius: 2px;
            top: -6px;
            transform-origin: bottom center;
        }
        .butterfly .antenna-left {
            transform: rotate(-30deg) translateX(-4px);
        }
        .butterfly .antenna-right {
            transform: rotate(30deg) translateX(4px);
        }
        .butterfly .antenna::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #2d1b1b;
            border-radius: 50%;
        }

        @keyframes flapWing {
            0% {
                transform: rotate(20deg) scaleX(1);
            }
            100% {
                transform: rotate(-20deg) scaleX(0.6);
            }
        }
        .butterfly .wing-left {
            animation: flapWingLeft 0.25s ease-in-out infinite alternate;
        }
        .butterfly .wing-right {
            animation: flapWingRight 0.25s ease-in-out infinite alternate;
        }

        @keyframes flapWingLeft {
            0% {
                transform: rotate(25deg) scaleX(1) translateX(-10px);
            }
            100% {
                transform: rotate(-15deg) scaleX(0.5) translateX(-6px);
            }
        }
        @keyframes flapWingRight {
            0% {
                transform: rotate(-25deg) scaleX(1) translateX(10px);
            }
            100% {
                transform: rotate(15deg) scaleX(0.5) translateX(6px);
            }
        }

        @keyframes flyButterfly {
            0% {
                left: -10%;
                top: 20%;
                transform: scale(0.8) rotate(0deg);
            }
            15% {
                top: 35%;
                transform: scale(0.9) rotate(8deg);
            }
            30% {
                left: 30%;
                top: 15%;
                transform: scale(1) rotate(-5deg);
            }
            50% {
                left: 55%;
                top: 40%;
                transform: scale(0.9) rotate(10deg);
            }
            70% {
                left: 75%;
                top: 20%;
                transform: scale(1.1) rotate(-8deg);
            }
            85% {
                top: 45%;
                transform: scale(0.9) rotate(6deg);
            }
            100% {
                left: 110%;
                top: 30%;
                transform: scale(0.8) rotate(0deg);
            }
        }

        /* ===== LEBAH ===== */
        .bee {
            position: absolute;
            z-index: 15;
            pointer-events: none;
            animation: flyBee var(--bee-duration, 8s) ease-in-out infinite;
        }

        .bee-body {
            position: relative;
            width: 28px;
            height: 20px;
            background: linear-gradient(180deg, #f5c542 30%, #222 30%, #222 50%, #f5c542 50%, #f5c542 70%, #222 70%, #222 90%, #f5c542 90%);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .bee-body::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 6px;
            width: 16px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: rotate(-20deg);
        }
        .bee-wing {
            position: absolute;
            width: 16px;
            height: 12px;
            background: rgba(200, 230, 255, 0.5);
            border-radius: 50%;
            top: -8px;
            transform-origin: bottom center;
            animation: buzzWing 0.12s linear infinite alternate;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bee-wing-left {
            left: -2px;
            transform: rotate(-30deg);
        }
        .bee-wing-right {
            right: -2px;
            transform: rotate(30deg);
        }
        .bee-eye {
            position: absolute;
            width: 4px;
            height: 5px;
            background: #111;
            border-radius: 50%;
            top: 2px;
        }
        .bee-eye-left {
            left: 6px;
        }
        .bee-eye-right {
            right: 6px;
        }
        .bee-stinger {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 2px;
            background: #222;
            border-radius: 0 2px 2px 0;
        }

        @keyframes buzzWing {
            0% {
                transform: rotate(-40deg) scaleY(0.8);
            }
            100% {
                transform: rotate(40deg) scaleY(0.8);
            }
        }

        @keyframes flyBee {
            0% {
                left: -5%;
                top: 60%;
            }
            20% {
                left: 15%;
                top: 45%;
            }
            40% {
                left: 35%;
                top: 65%;
            }
            60% {
                left: 55%;
                top: 40%;
            }
            80% {
                left: 75%;
                top: 60%;
            }
            100% {
                left: 105%;
                top: 50%;
            }
        }

        /* ===== BURUNG ===== */
        .bird {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            animation: flyBird var(--bird-duration, 16s) linear infinite;
        }

        .bird-body {
            position: relative;
            width: 16px;
            height: 10px;
            background: #2d2d2d;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-10deg);
        }
        .bird-body::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 8px;
            height: 6px;
            background: #2d2d2d;
            border-radius: 50% 50% 0 50%;
            transform: rotate(-20deg);
        }
        .bird-wing {
            position: absolute;
            width: 20px;
            height: 6px;
            background: #3d3d3d;
            border-radius: 50%;
            top: -2px;
            transform-origin: center left;
            animation: flapBird 0.4s ease-in-out infinite alternate;
        }
        .bird-wing-left {
            left: -4px;
            transform: rotate(-30deg);
        }
        .bird-wing-right {
            left: 4px;
            transform: rotate(30deg);
            animation-delay: 0.2s;
        }
        .bird-tail {
            position: absolute;
            right: -10px;
            top: 2px;
            width: 10px;
            height: 4px;
            background: #2d2d2d;
            border-radius: 0 50% 50% 0;
            transform: rotate(10deg);
        }

        @keyframes flapBird {
            0% {
                transform: rotate(-40deg) scaleY(0.6);
            }
            100% {
                transform: rotate(40deg) scaleY(0.6);
            }
        }

        @keyframes flyBird {
            0% {
                left: -10%;
                top: 10%;
            }
            25% {
                left: 20%;
                top: 5%;
            }
            50% {
                left: 50%;
                top: 15%;
            }
            75% {
                left: 75%;
                top: 4%;
            }
            100% {
                left: 110%;
                top: 8%;
            }
        }

        /* ===== KELOPAK JATUH ===== */
        .petal-fall {
            position: fixed;
            width: 12px;
            height: 16px;
            border-radius: 50% 0 50% 50%;
            opacity: 0.7;
            z-index: 30;
            pointer-events: none;
            animation: fallPetal linear forwards;
        }

        @keyframes fallPetal {
            0% {
                opacity: 0.9;
                transform: translateY(-20px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateY(10vh) rotate(30deg) scale(1);
            }
            90% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(0.3);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .sun {
                width: 50px;
                height: 50px;
                right: 8%;
            }
            .cloud-1 {
                width: 100px;
                height: 30px;
            }
            .cloud-1::before {
                width: 40px;
                height: 40px;
                top: -20px;
                left: 15px;
            }
            .cloud-1::after {
                width: 60px;
                height: 50px;
                top: -25px;
                left: 40px;
            }
            .cloud-2 {
                width: 130px;
                height: 35px;
            }
            .cloud-2::before {
                width: 50px;
                height: 45px;
                top: -25px;
                left: 20px;
            }
            .cloud-2::after {
                width: 70px;
                height: 55px;
                top: -28px;
                left: 55px;
            }
            .cloud-3 {
                width: 90px;
                height: 25px;
            }
            .cloud-3::before {
                width: 35px;
                height: 35px;
                top: -18px;
                left: 12px;
            }
            .cloud-3::after {
                width: 50px;
                height: 40px;
                top: -20px;
                left: 35px;
            }
        }

        /* ===== JUDUL ===== */
        .title {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
            z-index: 50;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 28px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            white-space: nowrap;
        }
        .title span {
            display: inline-block;
            animation: titlePulse 3s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }
        @media (max-width: 600px) {
            .title {
                font-size: 12px;
                padding: 6px 16px;
                bottom: 12px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- LANGIT & MATAHARI -->
    <div class="sky"></div>
    <div class="sun"></div>

    <!-- AWAN -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- RUMPUT -->
    <div class="grass"></div>

    <!-- TEMPAT BUNGA -->
    <div class="flower-container" id="flowerContainer"></div>

    <!-- KUPU-KUPU -->
    <div class="butterfly" style="--fly-duration:14s; top:25%; left:-10%;">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
        <div class="body"></div>
        <div class="antenna antenna-left"></div>
        <div class="antenna antenna-right"></div>
    </div>
    <div class="butterfly" style="--fly-duration:18s; top:45%; left:-10%; animation-delay:-4s; transform:scale(0.7);">
        <div class="wing wing-left" style="background:radial-gradient(ellipse at 40% 30%, #ffb07c, #e07c3a);"></div>
        <div class="wing wing-right" style="background:radial-gradient(ellipse at 60% 30%, #ffb07c, #d06a2a);"></div>
        <div class="body"></div>
        <div class="antenna antenna-left"></div>
        <div class="antenna antenna-right"></div>
    </div>
    <div class="butterfly" style="--fly-duration:16s; top:10%; left:-10%; animation-delay:-9s; transform:scale(0.6);">
        <div class="wing wing-left" style="background:radial-gradient(ellipse at 40% 30%, #9f7cff, #6a3ad0);"></div>
        <div class="wing wing-right" style="background:radial-gradient(ellipse at 60% 30%, #9f7cff, #5a2ab8);"></div>
        <div class="body"></div>
        <div class="antenna antenna-left"></div>
        <div class="antenna antenna-right"></div>
    </div>

    <!-- LEBAH -->
    <div class="bee" style="--bee-duration:9s; top:55%; left:-5%;">
        <div class="bee-body">
            <div class="bee-eye bee-eye-left"></div>
            <div class="bee-eye bee-eye-right"></div>
            <div class="bee-wing bee-wing-left"></div>
            <div class="bee-wing bee-wing-right"></div>
            <div class="bee-stinger"></div>
        </div>
    </div>
    <div class="bee" style="--bee-duration:11s; top:35%; left:-5%; animation-delay:-5s; transform:scale(0.8);">
        <div class="bee-body">
            <div class="bee-eye bee-eye-left"></div>
            <div class="bee-eye bee-eye-right"></div>
            <div class="bee-wing bee-wing-left"></div>
            <div class="bee-wing bee-wing-right"></div>
            <div class="bee-stinger"></div>
        </div>
    </div>

    <!-- BURUNG -->
    <div class="bird" style="--bird-duration:20s; top:8%; left:-10%;">
        <div class="bird-body">
            <div class="bird-wing bird-wing-left"></div>
            <div class="bird-wing bird-wing-right"></div>
            <div class="bird-tail"></div>
        </div>
    </div>
    <div class="bird" style="--bird-duration:22s; top:14%; left:-10%; animation-delay:-8s; transform:scale(0.7);">
        <div class="bird-body" style="background:#4a3a2a;">
            <div class="bird-wing bird-wing-left" style="background:#5a4a3a;"></div>
            <div class="bird-wing bird-wing-right" style="background:#5a4a3a;"></div>
            <div class="bird-tail" style="background:#4a3a2a;"></div>
        </div>
    </div>

    <!-- KELOPAK JATUH (dibuat via JS) -->
    <div id="petalContainer"></div>

    <!-- JUDUL -->
    <div class="title"><span>✨ Taman Bunga Bermekaran ✨</span></div>

    <script>
        // ============================================================
        // 1. BUNGA — dibuat dengan CSS, ditempatkan secara dinamis
        // ============================================================
        (function createFlowers() {
            const container = document.getElementById('flowerContainer');
            const colors = [
                { petal: '#f06292', center: '#fdd835', name: 'pink' },
                { petal: '#ce93d8', center: '#fdd835', name: 'purple' },
                { petal: '#ff8a65', center: '#fdd835', name: 'peach' },
                { petal: '#ef5350', center: '#fdd835', name: 'red' },
                { petal: '#ffd54f', center: '#ff8f00', name: 'yellow' },
                { petal: '#81c784', center: '#fdd835', name: 'green' },
                { petal: '#64b5f6', center: '#fdd835', name: 'blue' },
                { petal: '#f48fb1', center: '#fdd835', name: 'lightpink' },
                { petal: '#ffe082', center: '#f9a825', name: 'cream' },
                { petal: '#a1887f', center: '#fdd835', name: 'brown' },
            ];

            // Posisi bunga di layar (dalam %)
            const positions = [
                { x: 5, y: 55, stem: 60, size: 1.0, delay: 0.0 },
                { x: 12, y: 50, stem: 70, size: 1.1, delay: 0.3 },
                { x: 20, y: 60, stem: 50, size: 0.9, delay: 0.6 },
                { x: 28, y: 45, stem: 80, size: 1.2, delay: 0.1 },
                { x: 35, y: 58, stem: 55, size: 1.0, delay: 0.8 },
                { x: 43, y: 48, stem: 75, size: 1.15, delay: 0.2 },
                { x: 50, y: 55, stem: 65, size: 1.0, delay: 0.5 },
                { x: 58, y: 42, stem: 85, size: 1.25, delay: 0.0 },
                { x: 65, y: 60, stem: 50, size: 0.9, delay: 0.7 },
                { x: 72, y: 50, stem: 70, size: 1.1, delay: 0.3 },
                { x: 80, y: 55, stem: 60, size: 1.0, delay: 0.9 },
                { x: 88, y: 47, stem: 78, size: 1.2, delay: 0.4 },
                { x: 94, y: 58, stem: 55, size: 0.95, delay: 0.6 },
                // tambahan di tengah
                { x: 16, y: 65, stem: 40, size: 0.7, delay: 1.0 },
                { x: 42, y: 65, stem: 45, size: 0.8, delay: 0.9 },
                { x: 68, y: 68, stem: 38, size: 0.7, delay: 1.1 },
                { x: 55, y: 35, stem: 95, size: 1.3, delay: 0.2 },
                { x: 76, y: 38, stem: 90, size: 1.2, delay: 0.5 },
                { x: 8, y: 70, stem: 35, size: 0.6, delay: 1.2 },
                { x: 90, y: 68, stem: 38, size: 0.65, delay: 1.0 },
            ];

            positions.forEach((pos, index) => {
                const color = colors[index % colors.length];
                const petalCount = 6 + Math.floor(Math.random() * 4); // 6-9 kelopak
                const stemHeight = pos.stem;
                const size = pos.size;
                const delay = pos.delay;

                const flower = document.createElement('div');
                flower.className = 'flower swing';
                flower.style.left = pos.x + '%';
                flower.style.bottom = (pos.y - 10) + '%';
                flower.style.animationDelay = delay + 's';
                flower.style.transform = 'scale(' + size + ')';

                // Batang
                const stem = document.createElement('div');
                stem.className = 'stem';
                stem.style.setProperty('--stem-height', stemHeight + 'px');
                stem.style.animationDelay = (delay + 0.2) + 's';
                flower.appendChild(stem);

                // Kepala bunga
                const head = document.createElement('div');
                head.className = 'head';
                head.style.animationDelay = (delay + 0.6) + 's';
                head.style.bottom = stemHeight + 'px';

                // Pusat bunga
                const center = document.createElement('div');
                center.style.cssText = `
                            position: absolute;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            width: ${14 * size}px;
                            height: ${14 * size}px;
                            background: radial-gradient(circle, ${color.center}, ${color.center}cc);
                            border-radius: 50%;
                            box-shadow: 0 0 12px rgba(0,0,0,0.1);
                            z-index: 2;
                            border: 2px solid rgba(255,255,255,0.3);
                        `;
                head.appendChild(center);

                // Kelopak
                const petalSize = 16 * size;
                for (let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * 360;
                    const rot = angle + (Math.random() * 6 - 3);
                    const dist = 12 * size + Math.random() * 4 * size;

                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    const w = petalSize * (0.8 + Math.random() * 0.3);
                    const h = petalSize * (1.0 + Math.random() * 0.3);
                    petal.style.width = w + 'px';
                    petal.style.height = h + 'px';
                    petal.style.background = `radial-gradient(ellipse at 30% 20%, ${color.petal}dd, ${color.petal})`;
                    petal.style.setProperty('--rot', rot + 'deg');
                    petal.style.transform = `rotate(${rot}deg) translateX(${dist}px)`;
                    petal.style.transformOrigin = 'center center';
                    petal.style.borderRadius = '50% 0 50% 50%';
                    petal.style.animationDelay = (delay + 0.6 + i * 0.04) + 's';
                    petal.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)';
                    petal.style.border = '1px solid rgba(255,255,255,0.15)';
                    head.appendChild(petal);
                }

                flower.appendChild(head);
                container.appendChild(flower);
            });
        })();

        // ============================================================
        // 2. KELOPAK JATUH (petals falling)
        // ============================================================
        (function createFallingPetals() {
            const container = document.getElementById('petalContainer');
            const petalColors = ['#f06292', '#ce93d8', '#ff8a65', '#ef5350', '#ffd54f', '#81c784', '#64b5f6', '#f48fb1', '#ffe082',
                '#ff7eb3'
            ];

            function spawnPetal() {
                const el = document.createElement('div');
                el.className = 'petal-fall';
                const size = 8 + Math.random() * 12;
                const color = petalColors[Math.floor(Math.random() * petalColors.length)];
                el.style.width = size + 'px';
                el.style.height = (size * 1.2) + 'px';
                el.style.background = color;
                el.style.left = Math.random() * 100 + '%';
                el.style.top = '-20px';
                el.style.borderRadius = Math.random() > 0.5 ? '50% 0 50% 50%' : '0 50% 50% 50%';
                el.style.animationDuration = (6 + Math.random() * 8) + 's';
                el.style.animationDelay = '0s';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                el.style.opacity = 0.5 + Math.random() * 0.4;
                container.appendChild(el);

                // Hapus setelah animasi selesai
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, 14000);
            }

            // Spawn awal
            for (let i = 0; i < 20; i++) {
                setTimeout(() => spawnPetal(), i * 300);
            }

            // Spawn terus menerus
            setInterval(() => {
                spawnPetal();
                if (Math.random() > 0.5) {
                    setTimeout(spawnPetal, 300);
                }
            }, 1800);
        })();

        // ============================================================
        // 3. EFEK KEDIP (untuk suasana)
        // ============================================================
        (function twinkle() {
            const stars = document.createElement('div');
            stars.style.cssText = `
                        position: fixed;
                        top:0; left:0; width:100%; height:100%;
                        pointer-events: none;
                        z-index: 0;
                        overflow: hidden;
                    `;
            document.body.prepend(stars);

            for (let i = 0; i < 30; i++) {
                const dot = document.createElement('div');
                const size = 1 + Math.random() * 2;
                dot.style.cssText = `
                            position: absolute;
                            width: ${size}px;
                            height: ${size}px;
                            background: rgba(255,255,240,${0.2 + Math.random() * 0.4});
                            border-radius: 50%;
                            top: ${Math.random() * 60}%;
                            left: ${Math.random() * 100}%;
                            animation: twinkleStar ${2 + Math.random() * 4}s ease-in-out infinite alternate;
                            animation-delay: ${Math.random() * 3}s;
                        `;
                stars.appendChild(dot);
            }

            // inject keyframes untuk twinkle
            const style = document.createElement('style');
            style.textContent = `
                        @keyframes twinkleStar {
                            0% { opacity: 0.1; transform: scale(0.5); }
                            100% { opacity: 0.9; transform: scale(1.2); }
                        }
                    `;
            document.head.appendChild(style);
        })();

        // ============================================================
        // 4. RESPONSIF — sesuaikan ukuran bunga saat resize
        // ============================================================
        (function handleResize() {
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // tidak perlu rebuild, hanya trigger repaint
                    document.querySelectorAll('.flower').forEach(f => {
                        f.style.transform = f.style.transform; // repaint
                    });
                }, 200);
            });
        })();

        console.log('🌸 Taman Bunga Bermekaran — selamat menikmati!');
    </script>
