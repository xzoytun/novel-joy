<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuKita - Pengelolaan Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">💰 SakuKita</h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full font-medium">Kelola Keuanganmu</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- Kartu Ringkasan (Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Total Saldo -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-sm text-slate-500 font-medium">Total Saldo</span>
                <h2 id="saldo-total" class="text-2xl font-bold text-slate-900 mt-1">Rp 0</h2>
            </div>
            <!-- Total Pemasukan -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-sm text-emerald-600 font-medium">Pemasukan</span>
                <h2 id="total-pemasukan" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</h2>
            </div>
            <!-- Total Pengeluaran -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-sm text-rose-600 font-medium">Pengeluaran</span>
                <h2 id="total-pengeluaran" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</h2>
            </div>
        </div>

        <!-- Grid Bagian Form & Riwayat -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Form Tambah Transaksi -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 h-fit">
                <h3 class="font-semibold text-slate-800 mb-4 text-base">Tambah Transaksi</h3>
                <form id="form-transaksi" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan</label>
                        <input type="text" id="keterangan" required placeholder="Contoh: Gaji, Makan Siang" 
                            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="nominal" required placeholder="Contoh: 50000" 
                            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Jenis Transaksi</label>
                        <select id="tipe" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="pemasukan">Pemasukan</option>
                            <option value="pengeluaran">Pengeluaran</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition duration-200 shadow-sm">
                        Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Daftar Riwayat Transaksi -->
            <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-slate-800 text-base">Riwayat Transaksi</h3>
                    <button onclick="resetData()" class="text-xs text-rose-500 hover:underline font-medium">Reset Semua</button>
                </div>
                
                <div class="overflow-x-auto max-h-[350px] overflow-y-auto pr-1">
                    <ul id="list-transaksi" class="space-y-3">
                        <!-- Transaksi akan dimasukkan lewat Javascript secara dinamis -->
                        <p id="pesan-kosong" class="text-sm text-slate-400 text-center py-6">Belum ada transaksi tercatat.</p>
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-4 text-center text-xs text-slate-400">
        &copy; 2026 SakuKita. Dibuat dengan semangat ✨
    </footer>

    <!-- Script Javascript Pengelolaan Keuangan -->
    <script>
        // Ambil data dari LocalStorage atau buat array kosong jika belum ada
        let transaksiList = JSON.parse(localStorage.getItem('transaksi')) || [];

        const form = document.getElementById('form-transaksi');
        const keteranganInput = document.getElementById('keterangan');
        const nominalInput = document.getElementById('nominal');
        const tipeInput = document.getElementById('tipe');
        
        const saldoTotalEl = document.getElementById('saldo-total');
        const totalPemasukanEl = document.getElementById('total-pemasukan');
        const totalPengeluaranEl = document.getElementById('total-pengeluaran');
        const listTransaksiEl = document.getElementById('list-transaksi');
        const pesanKosongEl = document.getElementById('pesan-kosong');

        // Fungsi format angka ke Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Fungsi untuk memperbarui tampilan UI & LocalStorage
        function updateAplikasi() {
            listTransaksiEl.innerHTML = '';
            let pemasukan = 0;
            let pengeluaran = 0;

            if (transaksiList.length === 0) {
                pesanKosongEl.style.display = 'block';
            } else {
                pesanKosongEl.style.display = 'none';
                
                transaksiList.forEach((item, index) => {
                    if (item.tipe === 'pemasukan') {
                        pemasukan += Number(item.nominal);
                    } else {
                        pengeluaran += Number(item.nominal);
                    }

                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl hover:bg-slate-100/60 transition";
                    
                    const warnaTeks = item.tipe === 'pemasukan' ? 'text-emerald-600' : 'text-rose-650';
                    const tanda = item.tipe === 'pemasukan' ? '+' : '-';

                    li.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl flex items-center justify-center ${item.tipe === 'pemasukan' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} font-bold">
                                ${item.tipe === 'pemasukan' ? '↓' : '↑'}
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-slate-800">${item.keterangan}</h4>
                                <span class="text-[11px] text-slate-400">${item.tanggal || 'Baru saja'}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-sm font-semibold ${item.tipe === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">
                                ${tanda} ${formatRupiah(item.nominal)}
                            </span>
                            <button onclick="hapusTransaksi(${index})" class="text-slate-300 hover:text-rose-500 text-xs p-1 transition">
                                ✕
                            </button>
                        </div>
                    `;
                    listTransaksiEl.appendChild(li);
                });
            }

            let saldoTotal = pemasukan - pengeluaran;

            saldoTotalEl.innerText = formatRupiah(saldoTotal);
            totalPemasukanEl.innerText = formatRupiah(pemasukan);
            totalPengeluaranEl.innerText = formatRupiah(pengeluaran);

            // Simpan ke LocalStorage
            localStorage.setItem('transaksi', JSON.stringify(transaksiList));
        }

        // Tambah Transaksi Event
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const tanggalBaru = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const transaksiBaru = {
                keterangan: keteranganInput.value,
                nominal: parseFloat(nominalInput.value),
                tipe: tipeInput.value,
                tanggal: tanggalBaru
            };

            transaksiList.unshift(transaksiBaru); // Masukkan ke urutan paling atas
            updateAplikasi();

            // Reset form
            keteranganInput.value = '';
            nominalInput.value = '';
            keteranganInput.focus();
        });

        // Hapus Transaksi
        function hapusTransaksi(index) {
            transaksiList.splice(index, 1);
            updateAplikasi();
        }

        // Reset Semua Data
        function resetData() {
            if (confirm("Yakin ingin menghapus seluruh data transaksi?")) {
                transaksiList = [];
                updateAplikasi();
            }
        }

        // Jalankan saat pertama kali muat
        updateAplikasi();
    </script>
</body>
</html>
