<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu - Pengelola Keuangan</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-md">
            <h1 class="text-2xl font-bold">DompetKu 💰</h1>
            <p class="text-sm text-indigo-200">Kelola keuangan jadi lebih mudah</p>
            
            <!-- Kartu Saldo -->
            <div class="mt-6 bg-white text-gray-800 p-4 rounded-2xl shadow">
                <p class="text-xs text-gray-500 uppercase font-semibold">Total Saldo</p>
                <h2 id="total-saldo" class="text-3xl font-extrabold text-indigo-600">Rp 0</h2>
                
                <div class="flex justify-between mt-4 pt-4 border-t border-gray-100">
                    <div>
                        <p class="text-xs text-green-600 font-medium">Pemasukan</p>
                        <p id="total-pemasukan" class="text-sm font-bold text-green-700">Rp 0</p>
                    </div>
                    <div>
                        <p class="text-xs text-red-600 font-medium">Pengeluaran</p>
                        <p id="total-pengeluaran" class="text-sm font-bold text-red-700">Rp 0</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Konten Utama -->
        <main class="p-6 flex-1">
            
            <!-- Form Tambah Transaksi -->
            <section class="mb-6">
                <h3 class="text-lg font-bold text-gray-700 mb-3">Tambah Transaksi</h3>
                <form id="form-transaksi" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Keterangan</label>
                        <input type="text" id="keterangan" placeholder="Contoh: Gaji, Beli Makan" required 
                            class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Jumlah (Rp)</label>
                        <input type="number" id="jumlah" placeholder="Contoh: 50000" required 
                            class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Tipe Transaksi</label>
                        <select id="tipe" class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                            <option value="pemasukan">Pemasukan (+)</option>
                            <option value="pengeluaran">Pengeluaran (-)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition text-sm">
                        Simpan Transaksi
                    </button>
                </form>
            </section>

            <!-- Riwayat Transaksi -->
            <section>
                <h3 class="text-lg font-bold text-gray-700 mb-3">Riwayat Transaksi</h3>
                <div id="list-transaksi" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Data transaksi akan dimasukkan lewat Javascript di sini -->
                    <p class="text-sm text-gray-400 text-center py-4">Belum ada transaksi.</p>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="text-center py-4 text-xs text-gray-400 border-t">
            &copy; 2026 DompetKu App
        </footer>
    </div>

    <!-- JavaScript Logika Aplikasi -->
    <script>
        // Ambil data dari LocalStorage atau buat array kosong
        let transaksiList = JSON.parse(localStorage.getItem('transaksi')) || [];

        const form = document.getElementById('form-transaksi');
        const keteranganInput = document.getElementById('keterangan');
        const jumlahInput = document.getElementById('jumlah');
        const tipeInput = document.getElementById('tipe');
        
        const totalSaldoEl = document.getElementById('total-saldo');
        const totalPemasukanEl = document.getElementById('total-pemasukan');
        const totalPengeluaranEl = document.getElementById('total-pengeluaran');
        const listTransaksiEl = document.getElementById('list-transaksi');

        // Fungsi format ke Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Fungsi untuk memperbarui tampilan UI
        function updateUI() {
            listTransaksiEl.innerHTML = '';
            
            let pemasukan = 0;
            let pengeluaran = 0;

            if (transaksiList.length === 0) {
                listTransaksiEl.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">Belum ada transaksi.</p>`;
            }

            transaksiList.forEach((item, index) => {
                if (item.tipe === 'pemasukan') {
                    pemasukan += Number(item.jumlah);
                } else {
                    pengeluaran += Number(item.jumlah);
                }

                // Buat elemen HTML untuk setiap riwayat
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 rounded-lg border bg-white shadow-sm`;
                div.innerHTML = `
                    <div>
                        <p class="text-sm font-bold text-gray-700">${item.keterangan}</p>
                        <span class="text-xs ${item.tipe === 'pemasukan' ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50'} px-2 py-0.5 rounded-full font-medium">
                            ${item.tipe}
                        </span>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-extrabold ${item.tipe === 'pemasukan' ? 'text-green-600' : 'text-red-600'}">
                            ${item.tipe === 'pemasukan' ? '+' : '-'} ${formatRupiah(item.jumlah)}
                        </p>
                        <button onclick="hapusTransaksi(${index})" class="text-xs text-red-400 hover:text-red-600 mt-1">Hapus</button>
                    </div>
                `;
                listTransaksiEl.appendChild(div);
            });

            let totalSaldo = pemasukan - pengeluaran;

            totalSaldoEl.innerText = formatRupiah(totalSaldo);
            totalPemasukanEl.innerText = formatRupiah(pemasukan);
            totalPengeluaranEl.innerText = formatRupiah(pengeluaran);

            // Simpan ke localStorage
            localStorage.setItem('transaksi', JSON.stringify(transaksiList));
        }

        // Tambah transaksi baru
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const transaksiBaru = {
                keterangan: keteranganInput.value,
                jumlah: Number(jumlahInput.value),
                tipe: tipeInput.value
            };

            transaksiList.unshift(transaksiBaru); // Masukkan ke urutan paling atas
            updateUI();

            // Reset form
            keteranganInput.value = '';
            jumlahInput.value = '';
        });

        // Hapus transaksi
        function hapusTransaksi(index) {
            transaksiList.splice(index, 1);
            updateUI();
        }

        // Jalankan saat pertama kali dibuka
        updateUI();
    </script>
</body>
</html>
