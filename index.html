<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Novel - Koleksi Cerita Eksklusif</title>
    <style>
        :root {
            --bg-primary: #f7f7f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-main: #1a1a1f;
            --text-muted: #6b7280;
            --accent: #e50914;
            --accent-hover: #c40810;
            --border-color: #e5e5ea;
            --romance: #e84393;
            --horror: #2d3436;
            --comedy: #fdcb6e;
            --mystery: #6c5ce7;
            --fantasy: #00b894;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* ===== HEADER ===== */
        header {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #111;
            cursor: default;
        }

        .logo-area h1 .accent {
            color: var(--accent);
        }

        .creator-badge {
            background: linear-gradient(135deg, #e50914, #ff4757);
            color: #fff;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.25);
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 32px 20px 20px;
            max-width: 820px;
            margin: 0 auto;
        }

        .hero h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #111;
            letter-spacing: -0.5px;
        }

        .hero h2 .gradient {
            background: linear-gradient(135deg, var(--accent), #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 4px;
        }

        /* ===== SEARCH ===== */
        .search-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 14px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 0 18px 0 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
            max-width: 520px;
            margin: 0 auto;
            box-shadow: var(--shadow-sm);
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12), var(--shadow-sm);
        }

        .search-box .search-icon {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1;
            opacity: 0.7;
            margin-right: 10px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 0.93rem;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            min-width: 0;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
            font-weight: 400;
        }

        .search-box .clear-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            line-height: 1;
            transition: background var(--transition);
            display: none;
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        .search-box .clear-btn:hover {
            background: var(--bg-primary);
        }

        .search-results-hint {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 6px;
            min-height: 1.4em;
        }

        /* ===== CATEGORY TABS ===== */
        .category-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 12px;
            position: relative;
        }

        .category-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-scroll .tab-btn {
            flex: 0 0 auto;
            padding: 8px 18px;
            border: none;
            background: var(--bg-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 30px;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            scroll-snap-align: start;
        }

        .category-scroll .tab-btn .tab-icon {
            font-size: 0.95rem;
            line-height: 1;
        }

        .category-scroll .tab-btn .count {
            background: var(--bg-primary);
            padding: 0 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.7;
            transition: all var(--transition);
        }

        .category-scroll .tab-btn:hover {
            background: var(--bg-primary);
            border-color: #ccc;
        }

        .category-scroll .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(229, 9, 20, 0.25);
        }

        .category-scroll .tab-btn.active .count {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px 80px;
            flex: 1;
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            color: #111;
        }

        .section-title .genre-label {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .result-count {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* ===== NOVEL GRID ===== */
        .novel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
        }

        .novel-grid.hidden {
            display: none;
        }

        /* ===== NOVEL CARD ===== */
        .novel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            cursor: default;
        }

        .novel-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: rgba(229, 9, 20, 0.2);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            background: #e8e8ec;
        }

        .novel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .novel-card:hover .novel-image {
            transform: scale(1.04);
        }

        .status-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #1a9c4a;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 6px;
            border: 1px solid rgba(26, 156, 74, 0.25);
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .status-tag.completed {
            color: #6b7280;
            border-color: rgba(107, 114, 128, 0.25);
        }

        .genre-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 0.58rem;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 4px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: var(--text-muted);
        }

        .genre-tag.romance { background: var(--romance); }
        .genre-tag.horror { background: var(--horror); }
        .genre-tag.comedy { background: var(--comedy); color: #2d3436; }
        .genre-tag.mystery { background: var(--mystery); }
        .genre-tag.fantasy { background: var(--fantasy); }

        .novel-info {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .novel-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #111;
            line-height: 1.3;
        }

        .novel-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .novel-author span {
            color: var(--text-main);
            font-weight: 500;
        }

        .novel-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .novel-stats-mini {
            display: flex;
            gap: 14px;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .novel-stats-mini .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--accent);
            color: #fff;
            padding: 9px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background var(--transition), box-shadow var(--transition);
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(229, 9, 20, 0.3);
        }

        .btn.disabled {
            background: #e5e5ea;
            color: #9ca3af;
            pointer-events: none;
            box-shadow: none;
        }

        /* ===== EMPTY STATE ===== */
        .empty-category {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-category .empty-icon {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .empty-category p {
            font-size: 0.92rem;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        footer .footer-brand {
            color: #111;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 10px 16px;
            }
            .logo-area h1 {
                font-size: 1.1rem;
            }
            .hero h2 {
                font-size: 1.6rem;
            }
            .hero {
                padding: 24px 16px 14px;
            }
            .container {
                padding: 6px 14px 50px;
            }
            .novel-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 12px;
            }
            .image-wrapper {
                height: 220px;
            }
            .search-box {
                max-width: 100%;
                padding: 0 14px 0 16px;
            }
            .search-box input {
                padding: 10px 0;
                font-size: 0.88rem;
            }
            .search-wrapper {
                padding: 0 14px 10px;
            }
            .category-wrap {
                padding: 0 14px 8px;
            }
            .category-scroll .tab-btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .category-scroll .tab-btn .tab-icon {
                font-size: 0.85rem;
            }
            .creator-badge {
                font-size: 0.62rem;
                padding: 4px 10px;
            }
            .section-title {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .novel-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .image-wrapper {
                height: 160px;
            }
            .novel-title {
                font-size: 0.85rem;
            }
            .novel-desc {
                font-size: 0.7rem;
                -webkit-line-clamp: 2;
            }
            .novel-info {
                padding: 8px 10px 10px;
            }
            .btn {
                font-size: 0.7rem;
                padding: 6px;
                border-radius: 6px;
            }
            .status-tag {
                font-size: 0.5rem;
                padding: 2px 8px;
                top: 6px;
                right: 6px;
            }
            .genre-tag {
                font-size: 0.45rem;
                padding: 2px 8px;
                bottom: 6px;
                left: 6px;
            }
            .novel-stats-mini {
                font-size: 0.6rem;
                gap: 8px;
            }
            .novel-author {
                font-size: 0.65rem;
            }
            .category-scroll .tab-btn {
                padding: 5px 12px;
                font-size: 0.68rem;
            }
            .category-scroll .tab-btn .tab-icon {
                font-size: 0.75rem;
            }
            .category-scroll .tab-btn .count {
                font-size: 0.55rem;
                padding: 0 6px;
                line-height: 1.6;
            }
            .hero h2 {
                font-size: 1.3rem;
            }
            .hero p {
                font-size: 0.88rem;
            }
            .search-box input {
                font-size: 0.82rem;
                padding: 8px 0;
            }
        }
    </style>
</head>

        }, {
            id: 10,
            title: 'Naga dan Bintang Senja',
            author: 'Mr.Anom',
            category: 'fantasy',
            status: 'Ongoing',
            desc: 'Di dunia di mana naga dan manusia hidup berdampingan, seorang gadis biasa menemukan bahwa ia adalah pewaris takhta yang hilang.',
            image: 'https://via.placeholder.com/300x400/00b894/ffffff?text=Fantasy',
            reads: '14.6k',
            rating: '4.6',
            link: '#'
        }];

        // ================================================================
        //  RENDER ENGINE
        // ================================================================
        const categoryMap = {
            all: 'gridAll',
            romance: 'gridRomance',
            horror: 'gridHorror',
            comedy: 'gridComedy',
            mystery: 'gridMystery',
            fantasy: 'gridFantasy'
        };

        function renderNovel(gridId, novelList, searchTerm = '') {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = '';

            if (novelList.length === 0) {
                grid.innerHTML = `
                    <div class="empty-category">
                        <span class="empty-icon">📭</span>
                        <p>${searchTerm ? `Tidak ditemukan novel dengan judul "${searchTerm}"` : 'Belum ada novel di kategori ini. Nantikan update selanjutnya!'}</p>
                    </div>
                `;
                return;
            }

            novelList.forEach(novel => {
                const card = document.createElement('div');
                card.className = 'novel-card';

                const statusClass = novel.status === 'Completed' ? 'completed' : '';
                const genreClass = novel.category;

                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${novel.image}" alt="${novel.title}" class="novel-image" loading="lazy">
                        <div class="status-tag ${statusClass}">${novel.status}</div>
                        <div class="genre-tag ${genreClass}">${novel.category}</div>
                    </div>
                    <div class="novel-info">
                        <div>
                            <div class="novel-title">${novel.title}</div>
                            <div class="novel-author">oleh <span>${novel.author}</span></div>
                            <div class="novel-desc">${novel.desc}</div>
                            <div class="novel-stats-mini">
                                <span class="stat-item">📖 ${novel.reads}</span>
                                <span class="stat-item">⭐ ${novel.rating}</span>
                            </div>
                        </div>
                        <a href="${novel.link}" class="btn ${novel.link === '#' ? 'disabled' : ''}">
                            ${novel.link === '#' ? 'Segera Hadir' : 'Mulai Membaca'}
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAll(activeCategory = 'all', searchTerm = '') {
            const filtered = searchTerm.trim()
                ? novels.filter(n => n.title.toLowerCase().includes(searchTerm.toLowerCase()))
                : novels;

            // Update count di semua tab
            document.querySelectorAll('.tab-btn').forEach(tab => {
                const cat = tab.dataset.category;
                const count = cat === 'all'
                    ? filtered.length
                    : filtered.filter(n => n.category === cat).length;
                const countEl = tab.querySelector('.count');
                if (countEl) countEl.textContent = count;
            });

            // Render setiap grid
            ['all', 'romance', 'horror', 'comedy', 'mystery', 'fantasy'].forEach(cat => {
                const list = cat === 'all'
                    ? filtered
                    : filtered.filter(n => n.category === cat);
                renderNovel(categoryMap[cat], list, searchTerm);
            });

            // Update hint
            const hint = document.getElementById('searchHint');
            if (searchTerm.trim()) {
                const total = filtered.length;
                hint.textContent = total > 0
                    ? `Menampilkan ${total} novel untuk "${searchTerm.trim()}"`
                    : `Tidak ada novel dengan judul "${searchTerm.trim()}"`;
            } else {
                hint.textContent = '';
            }

            // Tampilkan grid sesuai kategori aktif
            switchCategory(activeCategory);
        }

        // ================================================================
        //  TAB SWITCHING
        // ================================================================
        let activeCategory = 'all';

        function switchCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === category);
            });
            document.querySelectorAll('.novel-grid').forEach(grid => {
                grid.classList.toggle('hidden', grid.dataset.category !== category);
            });
        }

        // ================================================================
        //  SEARCH LOGIC
        // ================================================================
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        let searchTimeout = null;

        function performSearch() {
            const term = searchInput.value;
            clearBtn.classList.toggle('visible', term.length > 0);
            renderAll(activeCategory, term);
        }

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 250);
        });

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.classList.remove('visible');
            performSearch();
            searchInput.focus();
        });

        // ================================================================
        //  TAB CLICK
        // ================================================================
        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.addEventListener('click', function() {
                const category = this.dataset.category;
                switchCategory(category);
                renderAll(category, searchInput.value);
                // Scroll ke container
                document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // ================================================================
        //  INIT
        // ================================================================
        renderAll('all', '');
    </script>

</body>
</html>
