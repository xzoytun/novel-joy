<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♚ Catur</title>
    <style>
        /* ── Reset & Font ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 20%, #1a1a2e, #0f0f1a);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .landing {
            max-width: 700px;
            width: 100%;
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 215, 140, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        .landing:hover {
            border-color: rgba(255, 215, 140, 0.3);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        }

        .logo {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 8px;
            filter: drop-shadow(0 8px 20px rgba(255, 215, 140, 0.2));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #f6e5d0, #d4a373);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.8;
            max-width: 450px;
            margin: 0 auto 36px;
            font-weight: 400;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .features span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .features span::before {
            content: "✦";
            color: #d4a373;
            font-size: 12px;
        }

        .btn-start {
            display: inline-block;
            padding: 18px 60px;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, #f6e5d0, #d4a373);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 8px 30px rgba(212, 163, 115, 0.25);
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 40px rgba(212, 163, 115, 0.4);
        }

        .btn-start:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 36px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .landing {
                padding: 36px 24px;
                border-radius: 32px;
            }
            h1 {
                font-size: 38px;
            }
            .logo {
                font-size: 52px;
            }
            .btn-start {
                padding: 16px 44px;
                font-size: 16px;
                width: 100%;
            }
            .features {
                gap: 12px;
            }
            .features span {
                font-size: 12px;
                padding: 4px 12px;
            }
            .desc {
                font-size: 14px;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>

    <div class="landing">
        <div class="logo">♚</div>
        <h1>Catur</h1>
        <p class="subtitle">Classic Chess</p>
        <p class="desc">
            Tantang diri Anda dalam permainan strategi abadi.<br />
            Mainkan melawan teman di layar yang sama.
        </p>
        <div class="features">
            <span>2 Pemain</span>
            <span>Aturan Lengkap</span>
            <span>Anti-kesalahan</span>
        </div>
        <a href="game.html" class="btn-start">Mulai Bermain</a>
        <p class="footer">— 2026 —</p>
    </div>

</body>
</html>
