<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Seru - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 420px;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-logo {
            font-size: 64px;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .menu-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .player-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid transparent;
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .player-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .player-btn.active {
            background: #ffc107;
            color: #333;
            border-color: #fff;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        .start-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(253, 160, 133, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="game-logo">
            <i class="fa-solid fa-chess-board"></i>
        </div>
        <h1>ULAR TANGGA</h1>
        <p>Pilih jumlah pemain dan mulai petualanganmu!</p>

        <div class="menu-label">Pilih Jumlah Pemain</div>
        <div class="player-options">
            <button class="player-btn" onclick="setPlayers(2)"><i class="fa-solid fa-user-group"></i> 2 Pemain</button>
            <button class="player-btn" onclick="setPlayers(3)"><i class="fa-solid fa-users"></i> 3 Pemain</button>
            <button class="player-btn active" onclick="setPlayers(4)"><i class="fa-solid fa-users-rectangle"></i> 4 Pemain</button>
        </div>

        <button class="start-btn" onclick="startGame()">Mulai Main <i class="fa-solid fa-play"></i></button>
    </div>

    <script>
        let selectedPlayers = 4;

        function setPlayers(num) {
            selectedPlayers = num;
            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function startGame() {
            localStorage.setItem('snake_ladder_players', selectedPlayers);
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
